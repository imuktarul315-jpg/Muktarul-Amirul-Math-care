<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Professional Q-Maker | Pro v13.8 Custom</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;700&family=Noto+Serif+Bengali:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --paper-font-size: 16px; --paper-font-family: 'Hind Siliguri'; }
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .print-area { 
            width: 210mm; min-height: 297mm; margin: 20px auto; 
            background: white; padding: 15mm; position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            font-size: var(--paper-font-size);
            font-family: var(--paper-font-family), serif;
        }
        .q-main { white-space: pre-line; line-height: 1.6; outline: none; }
        .question-item { 
            position: relative; 
            margin-bottom: 25px; 
            break-inside: avoid;
            display: block;
        }
        .editable-part:focus { background-color: #f0f7ff; outline: 1px dashed #4f46e5; border-radius: 4px; }

        .dynamic-cols {
            column-fill: auto;
            column-gap: 30px;
        }
        .cols-1 { column-count: 1 !important; }
        .cols-2 { column-count: 2 !important; }
        
        .align-btn { padding: 5px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; cursor: pointer; background: white; }
        .align-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; }
            .print-area { box-shadow: none; margin: 0; width: 100%; padding: 10mm; }
        }
    </style>
</head>
<body class="text-slate-800">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVDCH6t_QVkxRh6_-xtavYcwirHlpvO4Q",
            authDomain: "muktarul-question-creator.firebaseapp.com",
            databaseURL: "https://muktarul-question-creator-default-rtdb.firebaseio.com",
            projectId: "muktarul-question-creator",
            storageBucket: "muktarul-question-creator.firebasestorage.app",
            messagingSenderId: "639846260985",
            appId: "1:639846260985:web:c028bb10bcbab477fa4228"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>

    <nav class="no-print bg-white border-b px-6 py-3 flex justify-between items-center sticky top-0 z-50">
        <h1 class="font-black text-xl text-indigo-600">MathMaker <span class="text-slate-400 font-light">Pro v13.8</span></h1>
        <div class="flex gap-2">
            <button onclick="clearAllData()" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl font-bold text-xs border border-red-200">সব মুছুন</button>
            <button onclick="saveToCloud()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs shadow-lg">সার্ভারে সেভ</button>
            <button onclick="window.print()" class="px-4 py-2 bg-slate-800 text-white rounded-xl font-bold text-xs">প্রিন্ট / PDF</button>
        </div>
    </nav>

    <div class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 p-4">
        
        <div class="lg:col-span-4 no-print space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 sticky top-20">
                
                <p class="text-[10px] text-slate-400 mb-2 uppercase tracking-widest font-bold">কুইক ইনপুট</p>
                
                <input type="text" id="schoolInput" placeholder="প্রতিষ্ঠানের নাম" class="w-full p-2.5 border-2 rounded-xl mb-2 outline-none font-bold" oninput="syncData()">
                
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <input type="text" id="subjectInput" placeholder="বিষয়/সময়" class="p-2 border rounded-lg text-sm" oninput="syncData()">
                    <input type="text" id="classInput" placeholder="শ্রেণি" class="p-2 border rounded-lg text-sm" oninput="syncData()">
                </div>

                <div class="flex items-center justify-between mb-4 bg-indigo-50 p-2 rounded-xl border border-indigo-100">
                    <span class="text-xs font-bold text-indigo-600 ml-2">কলাম সংখ্যা:</span>
                    <div class="flex gap-1">
                        <button onclick="setGlobalCols(1)" id="col-btn-1" class="align-btn active">১ কলাম</button>
                        <button onclick="setGlobalCols(2)" id="col-btn-2" class="align-btn">২ কলাম</button>
                    </div>
                </div>

                <div class="flex items-center gap-3 mb-4 bg-slate-50 p-2 rounded-xl border border-slate-200">
                    <span class="text-xs font-bold text-slate-500">এলাইনমেন্ট:</span>
                    <button onclick="setAlign('left')" id="btn-left" class="align-btn active">বাম</button>
                    <button onclick="setAlign('center')" id="btn-center" class="align-btn">মাঝ</button>
                    <button onclick="setAlign('right')" id="btn-right" class="align-btn">ডান</button>
                    <input type="hidden" id="currentAlign" value="left">
                </div>

                <div class="flex bg-slate-100 p-1 rounded-2xl mb-4">
                    <button onclick="setType('creative')" id="btn-creative" class="flex-1 py-2 rounded-xl font-bold text-xs bg-white shadow text-indigo-600">সৃজনশীল</button>
                    <button onclick="setType('short')" id="btn-short" class="flex-1 py-2 rounded-xl font-bold text-xs text-slate-500">সংক্ষিপ্ত</button>
                    <button onclick="setType('mcq')" id="btn-mcq" class="flex-1 py-2 rounded-xl font-bold text-xs text-slate-500">MCQ</button>
                </div>

                <textarea id="mainText" placeholder="প্রশ্ন বা উদ্দীপক লিখুন..." class="w-full border-2 p-3 rounded-xl h-32 mb-2 text-sm focus:border-indigo-500 outline-none" oninput="livePreview()"></textarea>
                <div id="mathPreview" class="preview-box border border-dashed p-3 mb-2 text-sm min-h-[50px] bg-slate-50 rounded-xl q-main" style="text-align: left;"></div>

                <div id="creativeParts" class="space-y-1.5 mb-3">
                    <input type="text" id="partA" placeholder="ক) অংশ" class="w-full p-2 border rounded-lg text-xs">
                    <input type="text" id="partB" placeholder="খ) অংশ" class="w-full p-2 border rounded-lg text-xs">
                    <input type="text" id="partC" placeholder="গ) অংশ" class="w-full p-2 border rounded-lg text-xs">
                </div>

                <div id="mcqOptions" class="hidden grid grid-cols-2 gap-2 mb-3">
                    <input type="text" id="opt1" placeholder="ক) অপশন" class="p-2 border rounded-lg text-xs">
                    <input type="text" id="opt2" placeholder="খ) অপশন" class="p-2 border rounded-lg text-xs">
                    <input type="text" id="opt3" placeholder="গ) অপশন" class="p-2 border rounded-lg text-xs">
                    <input type="text" id="opt4" placeholder="ঘ) অপশন" class="p-2 border rounded-lg text-xs">
                </div>

                <button onclick="addQuestion()" class="w-full bg-indigo-600 text-white py-3.5 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition-all">➕ প্রশ্ন যুক্ত করুন</button>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div id="paper" class="print-area">
                <div class="text-center border-b-4 border-slate-800 pb-4 mb-6">
                    <h1 id="schoolName" class="text-3xl font-black mb-1 editable-part" contenteditable="true" onblur="autoSave()">প্রতিষ্ঠানের নাম</h1>
                    <p id="examName" class="font-bold text-lg editable-part" contenteditable="true" onblur="autoSave()">বার্ষিক পরীক্ষা - ২০২৬</p>
                    
                    <div class="mt-4 text-sm font-bold">
                        <div class="mb-1">শ্রেণি: <span id="className" class="editable-part" contenteditable="true" onblur="autoSave()">---</span></div>
                        <div class="flex justify-between px-10">
                            <span>বিষয়/সময়: <span id="subjectName" class="editable-part" contenteditable="true" onblur="autoSave()">---</span></span>
                            <span>পূর্ণমান: <span id="marksName" class="editable-part" contenteditable="true" onblur="autoSave()">১০০</span></span>
                        </div>
                    </div>
                </div>

                <div id="dynamicContainer" class="dynamic-cols cols-1">
                    <div id="creativeSection" class="hidden mb-8"><div id="creativeList" class="space-y-6"></div></div>
                    <div id="shortSection" class="hidden mb-8"><div id="shortList" class="space-y-4"></div></div>
                    <div id="mcqSection" class="hidden mb-8"><div id="mcqList" class="space-y-4"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentType = 'creative';
        const editAttr = `contenteditable="true" onblur="autoSave()"`;

        function setGlobalCols(count) {
            const container = document.getElementById('dynamicContainer');
            if(count === 1) {
                container.classList.replace('cols-2', 'cols-1');
                document.getElementById('col-btn-1').classList.add('active');
                document.getElementById('col-btn-2').classList.remove('active');
            } else {
                container.classList.replace('cols-1', 'cols-2');
                document.getElementById('col-btn-2').classList.add('active');
                document.getElementById('col-btn-1').classList.remove('active');
            }
            autoSave();
        }

        function setAlign(align) {
            document.getElementById('currentAlign').value = align;
            document.getElementById('mathPreview').style.textAlign = align;
            ['left', 'center', 'right'].forEach(a => {
                document.getElementById(`btn-${a}`).classList.toggle('active', a === align);
            });
        }

        function setType(type) {
            currentType = type;
            ['creative', 'short', 'mcq'].forEach(t => {
                document.getElementById(`btn-${t}`).className = t === type ? 
                    'flex-1 py-2 rounded-xl font-bold text-xs bg-white shadow text-indigo-600' : 
                    'flex-1 py-2 rounded-xl font-bold text-xs text-slate-500';
            });
            document.getElementById('mcqOptions').classList.toggle('hidden', type !== 'mcq');
            document.getElementById('creativeParts').classList.toggle('hidden', type !== 'creative');
        }

        function livePreview() {
            const p = document.getElementById('mathPreview');
            p.innerText = document.getElementById('mainText').value;
            renderMathInElement(p, { delimiters: [{left: '$', right: '$', display: false}] });
        }

        function syncData() {
            document.getElementById('schoolName').innerText = document.getElementById('schoolInput').value || "প্রতিষ্ঠানের নাম";
            document.getElementById('subjectName').innerText = document.getElementById('subjectInput').value || "---";
            document.getElementById('className').innerText = document.getElementById('classInput').value || "---";
        }

        function addQuestion() {
            const text = document.getElementById('mainText').value.trim();
            if (!text) return;

            const align = document.getElementById('currentAlign').value;
            let html = "";
            let listId = "";
            let sectionId = "";

            if (currentType === 'creative') {
                listId = 'creativeList'; sectionId = 'creativeSection';
                html = `<div class="w-full">
                            <div style="text-align: ${align}" class="q-main mb-2 font-bold editable-part" ${editAttr}>${text}</div>
                            <div class="ml-4 space-y-1 text-sm">
                                <div class="flex justify-between border-b border-dotted"><span class="editable-part" ${editAttr}>ক) ${document.getElementById('partA').value}</span><b>১</b></div>
                                <div class="flex justify-between border-b border-dotted"><span class="editable-part" ${editAttr}>খ) ${document.getElementById('partB').value}</span><b>২</b></div>
                                <div class="flex justify-between border-b border-dotted"><span class="editable-part" ${editAttr}>গ) ${document.getElementById('partC').value}</span><b>৪</b></div>
                            </div>
                        </div>`;
            } else if (currentType === 'short') {
                listId = 'shortList'; sectionId = 'shortSection';
                html = `<div class="q-main editable-part" style="text-align: ${align}" ${editAttr}>${text}</div>`;
            } else if (currentType === 'mcq') {
                listId = 'mcqList'; sectionId = 'mcqSection';
                html = `<div class="w-full">
                            <div class="q-main font-bold editable-part" ${editAttr}>${text}</div>
                            <div class="grid grid-cols-2 ml-4 mt-1 text-[13px]">
                                <span class="editable-part" ${editAttr}>ক) ${document.getElementById('opt1').value}</span>
                                <span class="editable-part" ${editAttr}>খ) ${document.getElementById('opt2').value}</span>
                                <span class="editable-part" ${editAttr}>গ) ${document.getElementById('opt3').value}</span>
                                <span class="editable-part" ${editAttr}>ঘ) ${document.getElementById('opt4').value}</span>
                            </div>
                        </div>`;
            }

            const wrapper = document.createElement('div');
            wrapper.className = "question-item group";
            wrapper.innerHTML = `<div class="no-print absolute -left-8 opacity-0 group-hover:opacity-100"><button onclick="this.closest('.question-item').remove(); autoSave();" class="text-red-500 text-xl font-bold">×</button></div>${html}`;
            
            document.getElementById(listId).appendChild(wrapper);
            document.getElementById(sectionId).classList.remove('hidden');

            resetInputs();
            renderMathInElement(document.getElementById('paper'), { delimiters: [{left: '$', right: '$', display: false}] });
            autoSave();
        }

        function resetInputs() {
            document.getElementById('mainText').value = "";
            document.getElementById('mathPreview').innerText = "";
            document.querySelectorAll('#creativeParts input, #mcqOptions input').forEach(i => i.value = "");
        }

        function autoSave() {
            const data = {
                school: document.getElementById('schoolName').innerText,
                exam: document.getElementById('examName').innerText,
                sub: document.getElementById('subjectName').innerText,
                cls: document.getElementById('className').innerText,
                marks: document.getElementById('marksName').innerText,
                colCount: document.getElementById('dynamicContainer').classList.contains('cols-2') ? 2 : 1,
                creative: document.getElementById('creativeList').innerHTML,
                short: document.getElementById('shortList').innerHTML,
                mcq: document.getElementById('mcqList').innerHTML
            };
            localStorage.setItem('math_q_maker_v13_8', JSON.stringify(data));
        }

        window.onload = () => {
            const saved = localStorage.getItem('math_q_maker_v13_8');
            if (saved) {
                const d = JSON.parse(saved);
                document.getElementById('schoolName').innerText = d.school || "প্রতিষ্ঠানের নাম";
                document.getElementById('examName').innerText = d.exam || "বার্ষিক পরীক্ষা - ২০২৬";
                document.getElementById('subjectName').innerText = d.sub || "---";
                document.getElementById('className').innerText = d.cls || "---";
                document.getElementById('marksName').innerText = d.marks || "১০০";
                document.getElementById('creativeList').innerHTML = d.creative || "";
                document.getElementById('shortList').innerHTML = d.short || "";
                document.getElementById('mcqList').innerHTML = d.mcq || "";
                
                if(d.colCount === 2) setGlobalCols(2);
                if(d.creative) document.getElementById('creativeSection').classList.remove('hidden');
                if(d.short) document.getElementById('shortSection').classList.remove('hidden');
                if(d.mcq) document.getElementById('mcqSection').classList.remove('hidden');
                
                renderMathInElement(document.getElementById('paper'), { delimiters: [{left: '$', right: '$', display: false}] });
            }
        };

        function clearAllData() { if(confirm("সব ডাটা মুছে যাবে। আপনি কি নিশ্চিত?")) { localStorage.clear(); location.reload(); } }
        
        function saveToCloud() {
            const id = document.getElementById('schoolName').innerText.trim();
            if(!id || id === "প্রতিষ্ঠানের নাম") return alert("প্রতিষ্ঠানের নাম দিন।");
            db.ref('exams/' + btoa(unescape(encodeURIComponent(id)))).set({
                school: id,
                exam: document.getElementById('examName').innerText,
                sub: document.getElementById('subjectName').innerText,
                cls: document.getElementById('className').innerText,
                creative: document.getElementById('creativeList').innerHTML,
                short: document.getElementById('shortList').innerHTML,
                mcq: document.getElementById('mcqList').innerHTML
            }).then(() => alert("✅ সফলভাবে ক্লাউডে সেভ হয়েছে।"));
        }
    </script>
</body>
</html>
