<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIRUL MATH CARE - Professional System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
        .brand-purple { background-color: #6b21a8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav class="brand-purple p-3 text-white flex justify-between items-center sticky top-0 z-50 shadow-xl border-b-2 border-yellow-500">
        <div class="flex items-center gap-2" onclick="location.reload()" style="cursor: pointer;">
            <img src="https://i.ibb.co/Lhy0W0P/1000018420.jpg" alt="Logo" class="w-10 h-10 rounded-full border border-yellow-400">
            <h1 class="text-sm md:text-lg font-bold uppercase">AMIRUL MATH CARE</h1>
        </div>
        <div class="flex gap-2">
            <button id="logoutBtn" onclick="logout()" class="hidden bg-red-500 text-white px-3 py-1 rounded-full text-xs font-bold">লগ আউট</button>
            <button id="adminLoginBtn" onclick="showSection('loginSection')" class="bg-yellow-500 text-purple-900 px-4 py-1 rounded-full font-bold text-xs">অ্যাডমিন</button>
        </div>
    </nav>

    <div id="studentView" class="container mx-auto mt-6 p-4 max-w-lg">
        <div class="bg-white p-6 rounded-3xl shadow-2xl border-t-8 border-purple-700 text-center">
            <h3 class="font-bold text-gray-700 mb-6 text-xl uppercase">Result & Admit Card</h3>
            <div class="space-y-4">
                <input type="date" id="searchDate" class="w-full p-3 border rounded-xl bg-gray-50 outline-none focus:ring-2 focus:ring-purple-500">
                <select id="searchClass" class="w-full p-3 border rounded-xl outline-none">
                    <option value="">শ্রেণী নির্বাচন করুন</option>
                    <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                </select>
                <input type="text" id="searchRoll" placeholder="রোল নম্বর" class="w-full p-3 border rounded-xl outline-none">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="checkResult()" class="brand-purple text-white py-3 rounded-xl font-bold shadow-lg">রেজাল্ট</button>
                    <button onclick="generateAdmit()" class="bg-amber-500 text-white py-3 rounded-xl font-bold shadow-lg">অ্যাডমিট</button>
                </div>
            </div>
        </div>
    </div>

    <div id="adminPanel" class="container mx-auto mt-6 p-4 hidden">
        
        <div class="bg-indigo-900 text-white p-6 rounded-2xl shadow-xl mb-6 border-b-4 border-green-500">
            <h2 class="font-bold mb-4 flex items-center gap-2 text-green-400"><i class="fab fa-whatsapp"></i> হোয়াটসঅ্যাপ ব্রডকাস্ট</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <select id="broadcastClass" class="p-3 rounded-xl text-black font-bold outline-none">
                    <option value="">শ্রেণী বেছে নিন</option>
                    <option value="৬ষ্ঠ">৬ষ্ঠ শ্রেণী</option><option value="৭ম">৭ম শ্রেণী</option><option value="৮ম">৮ম শ্রেণী</option><option value="৯ম">৯ম শ্রেণী</option><option value="১০ম">১০ম শ্রেণী</option>
                </select>
                <textarea id="broadcastMsg" placeholder="মেসেজ লিখুন..." class="p-3 rounded-xl text-black outline-none h-12"></textarea>
            </div>
            <button onclick="sendBroadcast()" class="w-full mt-4 bg-green-500 hover:bg-green-600 py-3 rounded-xl font-bold transition">মেসেজ পাঠান</button>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8 border-l-8 border-purple-600">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 id="formTitle" class="text-lg font-bold text-purple-900">রেজাল্ট এন্ট্রি</h2>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-red-500">পরীক্ষার পূর্ণমান (প্রতি বিষয়ে):</label>
                    <input type="number" id="fullMarks" value="100" class="w-16 p-1 border-2 border-red-300 rounded text-center font-bold">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <input type="hidden" id="editIndex" value="-1">
                <input type="date" id="examDate" class="p-2 border rounded-lg bg-gray-50">
                <select id="stdClass" onchange="updateSubjectInputs()" class="p-2 border rounded-lg bg-purple-50 font-bold">
                    <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                </select>
                <input type="text" id="stdName" placeholder="ছাত্রের নাম" class="p-2 border rounded-lg">
                <input type="number" id="stdRoll" placeholder="রোল" class="p-2 border rounded-lg">
                <input type="text" id="stdWhatsApp" placeholder="হোয়াটসঅ্যাপ (০১৭...)" class="p-2 border rounded-lg">
            </div>
            <div id="subjectInputs" class="space-y-2 bg-gray-50 p-4 rounded-xl border mb-6"></div>
            <button onclick="saveData()" id="saveBtn" class="w-full brand-purple text-white py-4 rounded-xl font-bold shadow-xl">সংরক্ষণ করুন</button>
            <button onclick="cancelEdit()" id="cancelBtn" class="hidden w-full mt-2 bg-gray-400 text-white py-2 rounded-xl font-bold">বাতিল</button>
        </div>

        <div id="listSection" class="bg-white rounded-2xl shadow-xl overflow-hidden border">
            <div class="p-4 brand-purple text-white flex justify-between items-center">
                <h3 class="font-bold">মেধা তালিকা</h3>
                <button onclick="downloadPDF('listSection', 'Student_Report')" class="bg-red-500 px-4 py-1 rounded-full text-xs font-bold">PDF রিপোর্ট</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead><tr class="bg-gray-100 font-bold"><th class="p-3 border">রোল</th><th class="p-3 border">নাম</th><th class="p-3 border">মোট মার্কস</th><th class="p-3 border">GPA</th><th class="p-3 border">মেরিট</th><th class="p-3 border no-pdf">অ্যাকশন</th></tr></thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="loginSection" class="container mx-auto mt-10 p-6 max-w-md hidden">
        <div class="bg-white p-8 rounded-2xl shadow-lg text-center border-t-4 border-purple-700">
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড" class="w-full p-3 border rounded-xl mb-4 text-center">
            <button onclick="adminLogin()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">লগইন</button>
        </div>
    </div>

    <div id="displayArea" class="container mx-auto p-4 flex flex-col items-center hidden">
        <div id="pdfContent" class="bg-white p-8 rounded-xl shadow-2xl border-4 border-double border-purple-900 w-full max-w-md"></div>
        <div class="flex gap-2 w-full max-w-md mt-4">
            <button onclick="downloadPDF('pdfContent', 'AMC_Document')" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg">ডাউনলোড PDF</button>
            <button onclick="location.reload()" class="flex-1 bg-gray-400 text-white py-3 rounded-xl font-bold shadow-lg">ফিরে যান</button>
        </div>
    </div>

    <script>
        const subjectsConfig = {
            "৬ষ্ঠ": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম", "আইসিটি"],
            "৭ম": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম", "আইসিটি"],
            "৮ম": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম", "আইসিটি"],
            "৯ম": ["গণিত", "পদার্থ", "রসায়ন", "জীববিজ্ঞান", "উচ্চতর গণিত", "বাংলা", "ইংরেজি", "আইসিটি"],
            "১০ম": ["গণিত", "পদার্থ", "রসায়ন", "জীববিজ্ঞান", "উচ্চতর গণিত", "বাংলা", "ইংরেজি", "আইসিটি"]
        };

        // অটোমেটিক গ্রেডিং লজিক (পূর্ণমানের ওপর ভিত্তি করে)
        function getGrade(obtained, full) {
            let percent = (obtained / full) * 100;
            if (percent >= 80) return { g: 'A+', p: 5.0 }; 
            if (percent >= 70) return { g: 'A', p: 4.0 };
            if (percent >= 60) return { g: 'A-', p: 3.5 }; 
            if (percent >= 50) return { g: 'B', p: 3.0 };
            if (percent >= 40) return { g: 'C', p: 2.0 }; 
            if (percent >= 33) return { g: 'D', p: 1.0 };
            return { g: 'F', p: 0.0 };
        }

        function showSection(id) {
            ['studentView', 'loginSection', 'adminPanel', 'displayArea'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function adminLogin() {
            if (document.getElementById('adminPass').value === "1617798358mA@") {
                localStorage.setItem('amc_admin_auth', 'true');
                showSection('adminPanel');
                updateSubjectInputs();
                renderTable();
                document.getElementById('logoutBtn').classList.remove('hidden');
            } else alert("ভুল পাসওয়ার্ড!");
        }

        function logout() { localStorage.removeItem('amc_admin_auth'); location.reload(); }

        function updateSubjectInputs() {
            const cls = document.getElementById('stdClass').value;
            const container = document.getElementById('subjectInputs');
            container.innerHTML = `<div class="grid grid-cols-5 gap-2 font-bold text-[10px] text-gray-500 mb-2">
                                    <div class="col-span-2">বিষয়</div><div>MCQ</div><div>CQ</div><div>মোট</div>
                                   </div>`;
            subjectsConfig[cls].forEach(sub => {
                container.innerHTML += `
                    <div class="grid grid-cols-5 gap-2 items-center border-b pb-1">
                        <div class="col-span-2 text-xs font-bold text-purple-800">${sub}</div>
                        <input type="number" oninput="calcTotal('${sub}')" id="mcq_${sub}" class="w-full p-1 border rounded text-center text-xs outline-none">
                        <input type="number" oninput="calcTotal('${sub}')" id="cq_${sub}" class="w-full p-1 border rounded text-center text-xs outline-none">
                        <div id="total_${sub}" class="text-center font-bold text-blue-600 text-xs">0</div>
                    </div>`;
            });
        }

        function calcTotal(sub) {
            const m = Number(document.getElementById(`mcq_${sub}`).value || 0);
            const c = Number(document.getElementById(`cq_${sub}`).value || 0);
            document.getElementById(`total_${sub}`).innerText = m + c;
        }

        function getMerit(roll, cls, date, total) {
            let data = JSON.parse(localStorage.getItem('amc_db_v8') || "[]");
            let filtered = data.filter(s => s.cls === cls && s.date === date);
            filtered.sort((a, b) => b.grandTotal - a.grandTotal);
            let pos = filtered.findIndex(s => s.roll == roll && s.grandTotal == total) + 1;
            return pos || '-';
        }

        function saveData() {
            const date = document.getElementById('examDate').value;
            const cls = document.getElementById('stdClass').value;
            const name = document.getElementById('stdName').value;
            const roll = document.getElementById('stdRoll').value;
            const wa = document.getElementById('stdWhatsApp').value;
            const fMarks = Number(document.getElementById('fullMarks').value);
            const editIdx = Number(document.getElementById('editIndex').value);

            if(!date || !name || !roll || !wa) return alert("সব তথ্য দিন!");

            let scores = {}; let grandTotal = 0; let totalP = 0;
            subjectsConfig[cls].forEach(sub => {
                const mcq = Number(document.getElementById(`mcq_${sub}`).value || 0);
                const cq = Number(document.getElementById(`cq_${sub}`).value || 0);
                const t = mcq + cq;
                const {g, p} = getGrade(t, fMarks);
                scores[sub] = { mcq, cq, t, g, p };
                grandTotal += t; totalP += p;
            });

            let gpa = (totalP / subjectsConfig[cls].length).toFixed(2);
            let data = JSON.parse(localStorage.getItem('amc_db_v8') || "[]");
            const entry = { date, cls, name, roll, wa, scores, grandTotal, gpa, fMarks };

            if(editIdx === -1) data.push(entry); else { data[editIdx] = entry; cancelEdit(); }

            localStorage.setItem('amc_db_v8', JSON.stringify(data));
            renderTable(); alert("সফলভাবে সেভ হয়েছে!"); resetForm();
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            const data = JSON.parse(localStorage.getItem('amc_db_v8') || "[]");
            tbody.innerHTML = '';
            data.reverse().forEach((s, index) => {
                let merit = getMerit(s.roll, s.cls, s.date, s.grandTotal);
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-bold">${s.roll}</td><td class="p-3">${s.name}</td>
                        <td class="p-3 font-bold text-purple-700">${s.grandTotal} / ${s.fMarks * subjectsConfig[s.cls].length}</td>
                        <td class="p-3 font-bold text-green-600">${s.gpa}</td>
                        <td class="p-3"><span class="bg-yellow-400 px-2 rounded-full font-bold">#${merit}</span></td>
                        <td class="p-3 text-center flex gap-2 no-pdf">
                            <button onclick="editData(${index})" class="text-blue-500"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteData(${index})" class="text-red-500"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function sendBroadcast() {
            const cls = document.getElementById('broadcastClass').value;
            const msg = document.getElementById('broadcastMsg').value;
            const data = JSON.parse(localStorage.getItem('amc_db_v8') || "[]");
            const filteredRecipients = [...new Set(data.filter(s => s.cls === cls).map(s => s.wa))];
            if(filteredRecipients.length === 0) return alert("নম্বর পাওয়া যায়নি!");
            if(confirm(`${filteredRecipients.length} জনকে মেসেজ পাঠানো হবে?`)) {
                filteredRecipients.forEach((num, i) => {
                    setTimeout(() => { window.open(`https://wa.me/88${num}?text=${encodeURIComponent(msg)}`, '_blank'); }, i * 2000);
                });
            }
        }

        function checkResult() {
            const date = document.getElementById('searchDate').value;
            const roll = document.getElementById('searchRoll').value;
            const cls = document.getElementById('searchClass').value;
            const data = JSON.parse(localStorage.getItem('amc_db_v8') || "[]");
            const s = data.find(item => item.roll == roll && item.cls == cls && item.date == date);

            if (s) {
                showSection('displayArea');
                let merit = getMerit(s.roll, s.cls, s.date, s.grandTotal);
                let scoreHtml = '';
                for (let sub in s.scores) {
                    scoreHtml += `<tr class="border-b text-center text-[10px]"><td class="p-2 border text-left font-bold">${sub}</td><td class="p-2 border">${s.scores[sub].mcq}</td><td class="p-2 border">${s.scores[sub].cq}</td><td class="p-2 border font-bold text-purple-900">${s.scores[sub].t} / ${s.fMarks}</td><td class="p-2 border font-bold">${s.scores[sub].g}</td></tr>`;
                }
                document.getElementById('pdfContent').innerHTML = `
                    <div class="text-center mb-6">
                        <img src="https://i.ibb.co/Lhy0W0P/1000018420.jpg" class="w-16 h-16 mx-auto rounded-full border-2 border-yellow-500 mb-2">
                        <h2 class="text-xl font-black text-purple-900 uppercase">AMIRUL MATH CARE</h2>
                        <p class="text-[9px] font-bold text-gray-400 border-b pb-2 tracking-widest uppercase">Academic Performance Report</p>
                    </div>
                    <div class="grid grid-cols-2 text-[10px] font-bold mb-4 bg-purple-50 p-3 rounded-lg border">
                        <div>নাম: ${s.name}</div><div>রোল: ${s.roll}</div><div>শ্রেণী: ${s.cls}</div><div>তারিখ: ${s.date}</div>
                    </div>
                    <table class="w-full text-xs border-collapse border mb-6">
                        <thead class="bg-purple-700 text-white font-bold"><tr><th class="p-2 border">বিষয়</th><th class="p-2 border">MCQ</th><th class="p-2 border">CQ</th><th class="p-2 border">প্রাপ্ত / পূর্ণ</th><th class="p-2 border">গ্রেড</th></tr></thead>
                        <tbody>${scoreHtml}</tbody>
                    </table>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-purple-900 text-white p-2 rounded-lg text-center"><p class="text-[8px]">Total Marks</p><p class="text-sm font-black text-yellow-400">${s.grandTotal} / ${s.fMarks * subjectsConfig[s.cls].length}</p></div>
                        <div class="bg-indigo-900 text-white p-2 rounded-lg text-center"><p class="text-[8px]">GPA</p><p class="text-lg font-black">${s.gpa}</p></div>
                        <div class="bg-amber-500 text-white p-2 rounded-lg text-center"><p class="text-[8px]">Merit Rank</p><p class="text-lg font-black">#${merit}</p></div>
                    </div>`;
            } else alert("রেজাল্ট পাওয়া যায়নি!");
        }

        function generateAdmit() {
            const roll = document.getElementById('searchRoll').value;
            const cls = document.getElementById('searchClass').value;
            const data = JSON.parse(localStorage.getItem('amc_db_v8') || "[]");
            const s = data.find(item => item.roll == roll && item.cls == cls);
            if (s) {
                showSection('displayArea');
                document.getElementById('pdfContent').innerHTML = `
                    <div class="border-4 border-double border-purple-800 p-6 bg-white rounded-xl text-center">
                        <img src="https://i.ibb.co/Lhy0W0P/1000018420.jpg" class="w-20 h-20 mx-auto rounded-full mb-2 border-2 border-purple-900">
                        <h2 class="text-xl font-black text-purple-900 tracking-tighter">AMIRUL MATH CARE</h2>
                        <span class="bg-purple-900 text-white px-6 py-1 rounded-full text-[10px] font-bold uppercase">Admit Card</span>
                        <div class="mt-8 space-y-3 text-left font-bold text-gray-700 uppercase text-xs">
                            <p class="border-b flex justify-between"><span>Name:</span> <span>${s.name}</span></p>
                            <p class="border-b flex justify-between"><span>Roll:</span> <span>${s.roll}</span></p>
                            <p class="border-b flex justify-between"><span>Class:</span> <span>${s.cls}</span></p>
                            <p class="border-b flex justify-between"><span>WhatsApp:</span> <span>${s.wa}</span></p>
                        </div>
                        <div class="mt-12 flex justify-between items-end italic text-[9px] text-gray-400">
                            <span>Auto Generated</span><span class="border-t border-black pt-1 px-4 text-black font-bold">Admin Signature</span>
                        </div>
                    </div>`;
            } else alert("ছাত্র পাওয়া যায়নি!");
        }

        function downloadPDF(divId, fileName) {
            const element = document.getElementById(divId);
            const opt = { margin: 0.5, filename: fileName + '.pdf', html2canvas: { scale: 3 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } };
            html2pdf().set(opt).from(element).save();
        }

        function editData(index) {
            const data = JSON.parse(localStorage.getItem('amc_db_v8'))[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('examDate').value = data.date;
            document.getElementById('stdClass').value = data.cls;
            document.getElementById('stdName').value = data.name;
            document.getElementById('stdRoll').value = data.roll;
            document.getElementById('stdWhatsApp').value = data.wa;
            document.getElementById('fullMarks').value = data.fMarks || 100;
            updateSubjectInputs();
            setTimeout(() => {
                for(let sub in data.scores) {
                    if(document.getElementById(`mcq_${sub}`)) {
                        document.getElementById(`mcq_${sub}`).value = data.scores[sub].mcq;
                        document.getElementById(`cq_${sub}`).value = data.scores[sub].cq;
                        document.getElementById(`total_${sub}`).innerText = data.scores[sub].t;
                    }
                }
            }, 100);
            document.getElementById('formTitle').innerText = "তথ্য এডিট";
            document.getElementById('saveBtn').innerText = "আপডেট করুন";
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function deleteData(index) { if(confirm("মুছে ফেলবেন?")) { let data = JSON.parse(localStorage.getItem('amc_db_v8')); data.reverse().splice(index, 1); data.reverse(); localStorage.setItem('amc_db_v8', JSON.stringify(data)); renderTable(); } }

        function cancelEdit() { document.getElementById('editIndex').value = "-1"; document.getElementById('formTitle').innerText = "রেজাল্ট এন্ট্রি"; document.getElementById('saveBtn').innerText = "সংরক্ষণ করুন"; document.getElementById('cancelBtn').classList.add('hidden'); resetForm(); }

        function resetForm() { document.getElementById('stdName').value = ''; document.getElementById('stdRoll').value = ''; updateSubjectInputs(); }

        window.onload = () => { if(localStorage.getItem('amc_admin_auth')) adminLogin(); };
    </script>
</body>
</html>
