<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Professional Q-Maker | Pro v16.0 Live</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --paper-font: 'Hind Siliguri', sans-serif; }
        body { font-family: var(--paper-font); background-color: #f1f5f9; }
        .print-area { 
            width: 210mm; min-height: 297mm; margin: 20px auto; background: white; 
            padding: 15mm; box-shadow: 0 5px 25px rgba(0,0,0,0.1); font-size: 15px; line-height: 1.4; color: black;
        }
        .columns-container { columns: 2; column-gap: 30px; column-rule: 1px solid #eee; }
        .question-item { break-inside: avoid; margin-bottom: 15px; position: relative; border-bottom: 1px dashed #f0f0f0; padding-bottom: 10px; }
        .q-main { font-weight: 600; margin-bottom: 3px; }
        .geo-display { text-align: center; margin: 5px 0; }
        .mcq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-left: 20px; font-size: 13px; }
        .solution-box { font-size: 12px; color: #4338ca; background: #f5f3ff; padding: 5px; border-radius: 4px; margin-top: 5px; display: none; }
        .show-solutions .solution-box { display: block; }
        
        /* Live Preview Styles */
        #live-preview-container { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 15px; background: #fff; margin-top: 15px; }
        .live-badge { display: inline-block; background: #ef4444; color: white; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: bold; margin-bottom: 8px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        @media print { 
            .no-print { display: none !important; } 
            .print-area { box-shadow: none; margin: 0; width: 100%; padding: 10mm; }
            .show-solutions .solution-box { display: block; border: 1px solid #ccc; }
        }
    </style>
</head>
<body class="text-slate-800" oninput="updateLivePreview()">

    <nav class="no-print bg-white border-b px-4 py-2 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="flex flex-col">
                <span class="font-bold text-indigo-700 leading-none text-lg">MathMaker Pro</span>
                <span class="text-[10px] text-slate-400">v16.0 Multi-Column & Live Preview</span>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleSolutions()" id="solBtn" class="px-3 py-1.5 border border-indigo-200 text-indigo-600 rounded-lg text-xs font-bold bg-indigo-50">উত্তরপত্র দেখুন</button>
            <button onclick="clearAllData()" class="px-3 py-1.5 text-red-500 border border-red-200 rounded-lg text-xs font-bold">ক্লিয়ার</button>
            <button onclick="exportToPDF()" class="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-xs font-bold">PDF ডাউনলোড</button>
            <button onclick="window.print()" class="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold">প্রিন্ট</button>
        </div>
    </nav>

    <div class="max-w-[1500px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 p-4">
        <div class="lg:col-span-4 no-print space-y-4">
            <div class="bg-white p-5 rounded-2xl border shadow-sm sticky top-16 max-h-[90vh] overflow-y-auto">
                <div class="space-y-2 mb-4">
                    <input type="text" id="schoolInput" placeholder="প্রতিষ্ঠানের নাম" class="w-full p-2 border rounded-lg font-bold outline-none focus:ring-2 ring-indigo-400" oninput="syncData()">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="subjectInput" placeholder="বিষয়/সময়" class="p-2 border rounded-lg text-sm outline-none" oninput="syncData()">
                        <input type="text" id="classInput" placeholder="শ্রেণি" class="p-2 border rounded-lg text-sm outline-none" oninput="syncData()">
                    </div>
                </div>

                <div class="flex bg-slate-100 p-1 rounded-xl mb-4 text-xs font-bold">
                    <button onclick="setMode('creative')" id="m-creative" class="flex-1 py-2 rounded-lg bg-white shadow text-indigo-600">সৃজনশীল</button>
                    <button onclick="setMode('short')" id="m-short" class="flex-1 py-2 rounded-lg text-slate-500">সংক্ষিপ্ত</button>
                    <button onclick="setMode('mcq')" id="m-mcq" class="flex-1 py-2 rounded-lg text-slate-500">MCQ</button>
                </div>

                <div class="space-y-3">
                    <textarea id="mainText" placeholder="উদ্দীপক/প্রশ্ন লিখুন (Latex এর জন্য $...$ ব্যবহার করুন)" class="w-full border p-3 rounded-xl h-24 text-sm outline-none focus:ring-2 ring-indigo-400" oninput="updateLivePreview()"></textarea>
                    
                    <div id="geoBox" class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                        <select id="geoSelect" onchange="updateLivePreview()" class="w-full p-2 border rounded-lg text-xs mb-2 outline-none">
                            <option value="">জ্যামিতিক চিত্র (ঐচ্ছিক)</option>
                            <option value="triangle">ত্রিভুজ</option>
                            <option value="circle">বৃত্ত</option>
                            <option value="rectangle">আয়তক্ষেত্র</option>
                            <option value="parallelogram">সামান্তরিক</option>
                        </select>
                        <input type="text" id="geoLabels" placeholder="লেবেল (উদা: A, B, C)" class="w-full p-2 border rounded-lg text-xs outline-none" oninput="updateLivePreview()">
                    </div>

                    <div id="creativeFields" class="space-y-2">
                        <input type="text" id="partA" placeholder="ক) প্রশ্ন" class="w-full p-2 border rounded-lg text-sm" oninput="updateLivePreview()">
                        <input type="text" id="partB" placeholder="খ) প্রশ্ন" class="w-full p-2 border rounded-lg text-sm" oninput="updateLivePreview()">
                        <input type="text" id="partC" placeholder="গ) প্রশ্ন" class="w-full p-2 border rounded-lg text-sm" oninput="updateLivePreview()">
                    </div>

                    <div id="mcqFields" class="hidden grid grid-cols-2 gap-2">
                        <input type="text" id="opt1" placeholder="ক" class="p-2 border rounded-lg text-sm" oninput="updateLivePreview()">
                        <input type="text" id="opt2" placeholder="খ" class="p-2 border rounded-lg text-sm" oninput="updateLivePreview()">
                        <input type="text" id="opt3" placeholder="গ" class="p-2 border rounded-lg text-sm" oninput="updateLivePreview()">
                        <input type="text" id="opt4" placeholder="ঘ" class="p-2 border rounded-lg text-sm" oninput="updateLivePreview()">
                    </div>

                    <div class="pt-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">সমাধান (ঐচ্ছিক)</label>
                        <textarea id="solutionInput" placeholder="সঠিক উত্তর..." class="w-full border p-2 rounded-xl h-12 text-sm outline-none bg-emerald-50 focus:ring-2 ring-emerald-400" oninput="updateLivePreview()"></textarea>
                    </div>
                </div>

                <div id="live-preview-container">
                    <span class="live-badge">LIVE PREVIEW</span>
                    <div id="live-render-area" class="text-[13px]">
                        <p class="text-slate-400 italic">প্রশ্ন টাইপ করা শুরু করুন...</p>
                    </div>
                </div>

                <button onclick="addQuestion()" class="w-full mt-4 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg">➕ প্রশ্ন যুক্ত করুন</button>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div id="paper" class="print-area">
                <div class="text-center border-b-2 border-black pb-4 mb-6">
                    <h1 id="schoolName" class="text-3xl font-black">প্রতিষ্ঠানের নাম</h1>
                    <p class="font-bold text-lg">বার্ষিক পরীক্ষা - ২০২৬</p>
                    <div class="flex justify-between mt-4 px-10 text-sm font-bold">
                        <span>শ্রেণি: <span id="className">---</span></span>
                        <span>বিষয়: <span id="subjectName">---</span></span>
                        <span>পূর্ণমান: ১০০</span>
                    </div>
                </div>

                <div class="columns-container">
                    <div id="creativeSection" class="hidden mb-4">
                        <h4 class="font-bold border-b border-black mb-2 text-sm uppercase italic underline">সৃজনশীল অংশ:</h4>
                        <div id="creativeList"></div>
                    </div>

                    <div id="shortSection" class="hidden mb-4">
                        <h4 class="font-bold border-b border-black mb-2 text-sm uppercase italic underline">সংক্ষিপ্ত প্রশ্ন:</h4>
                        <div id="shortList"></div>
                    </div>

                    <div id="mcqSection" class="hidden mb-4">
                        <h4 class="font-bold border-b border-black mb-2 text-sm uppercase italic underline">বহুনির্বাচনী:</h4>
                        <div id="mcqList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mode = 'creative';
        let counts = { creative: 1, short: 1, mcq: 1 };
        let showSols = false;

        function setMode(m) {
            mode = m;
            document.getElementById('creativeFields').classList.toggle('hidden', m !== 'creative');
            document.getElementById('mcqFields').classList.toggle('hidden', m !== 'mcq');
            ['creative', 'short', 'mcq'].forEach(i => {
                document.getElementById('m-'+i).className = i === m ? 'flex-1 py-2 rounded-lg bg-white shadow text-indigo-600' : 'flex-1 py-2 rounded-lg text-slate-500';
            });
            updateLivePreview();
        }

        function syncData() {
            document.getElementById('schoolName').innerText = document.getElementById('schoolInput').value || "প্রতিষ্ঠানের নাম";
            document.getElementById('subjectName').innerText = document.getElementById('subjectInput').value || "---";
            document.getElementById('className').innerText = document.getElementById('classInput').value || "---";
        }

        function generateGeoSVG(type, labels) {
            if (!type) return "";
            const lab = labels ? labels.split(',').map(s => s.trim()) : [];
            let svg = "";
            const style = `fill="none" stroke="black" stroke-width="2"`;
            const labelStyle = `class="geo-label-text" style="font-size: 10px; font-style: italic;"`;

            if (type === 'triangle') svg = `<svg width="80" height="60" viewBox="0 0 100 70"><polygon points="50,10 90,60 10,60" ${style}/><text x="45" y="10" ${labelStyle}>${lab[0]||'A'}</text><text x="2" y="65" ${labelStyle}>${lab[1]||'B'}</text><text x="92" y="65" ${labelStyle}>${lab[2]||'C'}</text></svg>`;
            else if (type === 'circle') svg = `<svg width="60" height="60" viewBox="0 0 70 70"><circle cx="35" cy="35" r="25" ${style}/><circle cx="35" cy="35" r="1.5" fill="black"/><text x="38" y="38" ${labelStyle}>${lab[0]||'O'}</text></svg>`;
            else if (type === 'rectangle') svg = `<svg width="80" height="50" viewBox="0 0 100 60"><rect x="10" y="10" width="80" height="40" ${style}/><text x="5" y="10" ${labelStyle}>${lab[0]||'A'}</text><text x="90" y="10" ${labelStyle}>${lab[1]||'B'}</text></svg>`;
            else if (type === 'parallelogram') svg = `<svg width="80" height="50" viewBox="0 0 100 60"><polygon points="25,10 95,10 75,50 5,50" ${style}/></svg>`;

            return `<div class="geo-display">${svg}</div>`;
        }

        function updateLivePreview() {
            const text = document.getElementById('mainText').value;
            const geoHTML = generateGeoSVG(document.getElementById('geoSelect').value, document.getElementById('geoLabels').value);
            let liveHTML = "";

            if (!text && !geoHTML) {
                document.getElementById('live-render-area').innerHTML = `<p class="text-slate-400 italic">টাইপ শুরু করুন...</p>`;
                return;
            }

            if (mode === 'creative') {
                liveHTML = `<div><b>${counts.creative}। ${text}</b>${geoHTML}
                <div class="ml-4 opacity-70">ক) ${document.getElementById('partA').value}<br>খ) ${document.getElementById('partB').value}<br>গ) ${document.getElementById('partC').value}</div></div>`;
            } else if (mode === 'short') {
                liveHTML = `<div><b>${counts.short}। ${text}</b>${geoHTML}</div>`;
            } else {
                liveHTML = `<div><b>${counts.mcq}। ${text}</b>${geoHTML}
                <div class="grid grid-cols-2 text-xs opacity-70"><span>(ক) ${document.getElementById('opt1').value}</span><span>(খ) ${document.getElementById('opt2').value}</span></div></div>`;
            }

            const area = document.getElementById('live-render-area');
            area.innerHTML = liveHTML;
            renderMathInElement(area, { delimiters: [{left: '$', right: '$', display: false}], throwOnError: false });
        }

        function addQuestion() {
            const text = document.getElementById('mainText').value.trim();
            const solution = document.getElementById('solutionInput').value.trim();
            if (!text) return;

            const geoHTML = generateGeoSVG(document.getElementById('geoSelect').value, document.getElementById('geoLabels').value);
            const solHTML = solution ? `<div class="solution-box"><b>উত্তর:</b> ${solution}</div>` : "";
            
            let html = `<div class="question-item">
                        <button onclick="this.parentElement.remove()" class="no-print absolute -right-6 top-0 text-red-400 hover:text-red-600">×</button>`;
            
            if (mode === 'creative') {
                html += `<div class="q-main">${counts.creative}। ${text}</div>${geoHTML}
                         <div class="ml-4 text-sm">
                            <div class="flex justify-between"><span>ক) ${document.getElementById('partA').value}</span><b>২</b></div>
                            <div class="flex justify-between"><span>খ) ${document.getElementById('partB').value}</span><b>৪</b></div>
                            <div class="flex justify-between"><span>গ) ${document.getElementById('partC').value}</span><b>৪</b></div>
                         </div>${solHTML}</div>`;
                document.getElementById('creativeList').insertAdjacentHTML('beforeend', html);
                document.getElementById('creativeSection').classList.remove('hidden');
                counts.creative++;
            } else if (mode === 'short') {
                html += `<div class="q-main">${counts.short}। ${text}</div>${geoHTML}${solHTML}</div>`;
                document.getElementById('shortList').insertAdjacentHTML('beforeend', html);
                document.getElementById('shortSection').classList.remove('hidden');
                counts.short++;
            } else {
                html += `<div class="q-main">${counts.mcq}। ${text}</div>${geoHTML}
                         <div class="mcq-grid">
                            <span>(ক) ${document.getElementById('opt1').value}</span><span>(খ) ${document.getElementById('opt2').value}</span>
                            <span>(গ) ${document.getElementById('opt3').value}</span><span>(ঘ) ${document.getElementById('opt4').value}</span>
                         </div>${solHTML}</div>`;
                document.getElementById('mcqList').insertAdjacentHTML('beforeend', html);
                document.getElementById('mcqSection').classList.remove('hidden');
                counts.mcq++;
            }

            renderMathInElement(document.getElementById('paper'), { 
                delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
                throwOnError: false 
            });
            
            // Clear inputs & Reset Live
            document.getElementById('mainText').value = "";
            document.getElementById('solutionInput').value = "";
            updateLivePreview();
        }

        function toggleSolutions() {
            showSols = !showSols;
            document.getElementById('paper').classList.toggle('show-solutions', showSols);
            document.getElementById('solBtn').innerText = showSols ? "উত্তরপত্র লুকুান" : "উত্তরপত্র দেখুন";
        }

        function exportToPDF() {
            const element = document.getElementById('paper');
            html2pdf().set({ margin: 0, filename: 'Question_Paper.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(element).save();
        }

        function clearAllData() { if(confirm("সব ডাটা মুছে যাবে?")) location.reload(); }
    </script>
</body>
</html>
