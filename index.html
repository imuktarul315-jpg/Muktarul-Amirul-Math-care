<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIRUL MATH CARE - Complete Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f0f2f5; }
        .brand-purple { background-color: #4c1d95; }
        .hidden { display: none; }
        .logo-img { width: 70px; height: 70px; object-fit: cover; border-radius: 50%; border: 3px solid #fbbf24; margin: 0 auto; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

    <div class="bg-yellow-100 border-b border-yellow-200 py-2 no-print">
        <div class="container mx-auto px-4 flex items-center">
            <span class="bg-red-600 text-white text-[10px] font-black px-2 py-1 rounded mr-3 animate-pulse uppercase">Notice</span>
            <marquee id="mainNotice" class="text-sm font-semibold">আমিরুল ম্যাথ কেয়ারে আপনাকে স্বাগত।</marquee>
        </div>
    </div>

    <nav class="brand-purple p-4 text-white flex justify-between items-center sticky top-0 z-50 shadow-xl border-b-4 border-yellow-500 no-print">
        <div class="flex items-center gap-3" onclick="location.reload()" style="cursor: pointer;">
            <img src="https://i.ibb.co/Lhy0W0P/1000018420.jpg" alt="Logo" class="w-10 h-10 rounded-full border-2 border-white">
            <h1 class="text-lg md:text-xl font-black tracking-tighter">AMIRUL MATH CARE</h1>
        </div>
        <div class="flex gap-2">
            <button id="logoutBtn" onclick="logout()" class="hidden bg-red-500 hover:bg-red-600 px-4 py-1 rounded-full text-xs font-bold transition">লগ আউট</button>
            <button id="adminLoginBtn" onclick="showSection('loginSection')" class="bg-yellow-400 text-purple-900 hover:bg-yellow-500 px-5 py-1 rounded-full font-bold text-xs transition">অ্যাডমিন প্যানেল</button>
        </div>
    </nav>

    <div id="studentView" class="container mx-auto mt-8 p-4 max-w-lg no-print">
        <div class="bg-white p-8 rounded-3xl shadow-2xl border-t-8 border-purple-800">
            <div class="text-center mb-6">
                <i class="fas fa-graduation-cap text-4xl text-purple-700 mb-2"></i>
                <h3 class="font-bold text-gray-800 text-2xl">শিক্ষার্থী পোর্টাল</h3>
            </div>
            <div class="space-y-4">
                <input type="date" id="searchDate" class="w-full p-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50">
                <select id="searchClass" class="w-full p-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50">
                    <option value="">শ্রেণী নির্বাচন করুন</option>
                    <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                </select>
                <select id="searchExamType" class="w-full p-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50">
                    <option value="সাপ্তাহিক">সাপ্তাহিক পরীক্ষা</option>
                    <option value="মাসিক">মাসিক পরীক্ষা</option>
                    <option value="বার্ষিক">বার্ষিক পরীক্ষা</option>
                </select>
                <input type="text" id="searchRoll" placeholder="রোল নম্বর লিখুন" class="w-full p-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50">
                <div class="grid grid-cols-2 gap-4 pt-4">
                    <button onclick="checkResult()" class="brand-purple text-white py-4 rounded-2xl font-bold shadow-lg">রেজাল্ট</button>
                    <button onclick="generateAdmit()" class="bg-orange-500 text-white py-4 rounded-2xl font-bold shadow-lg">অ্যাডমিট</button>
                </div>
            </div>
        </div>
    </div>

    <div id="loginSection" class="container mx-auto mt-12 p-6 max-w-md hidden">
        <div class="bg-white p-10 rounded-2xl shadow-2xl text-center border-t-4 border-purple-700">
            <h2 class="text-2xl font-bold mb-6">অ্যাডমিন লগইন</h2>
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড" class="w-full p-4 border rounded-xl mb-6 text-center text-xl outline-none">
            <button onclick="adminLogin()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">লগইন</button>
        </div>
    </div>

    <div id="adminPanel" class="container mx-auto mt-6 p-4 hidden">
        <div class="mb-6 flex gap-4">
            <button onclick="toggleStudentManager()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg"><i class="fas fa-users-cog mr-2"></i>স্টুডেন্ট লিস্ট ম্যানেজ করুন</button>
        </div>

        <div id="studentManager" class="bg-white p-6 rounded-2xl shadow-xl mb-8 border-t-4 border-blue-600 hidden">
            <h2 class="font-bold text-xl mb-4 text-blue-800">শিক্ষার্থী ডাটাবেজ (একবার সেভ করুন)</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
                <input type="number" id="newRoll" placeholder="রোল" class="p-2 border rounded">
                <input type="text" id="newName" placeholder="নাম" class="p-2 border rounded">
                <select id="newClass" class="p-2 border rounded">
                    <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                </select>
                <input type="text" id="newWa" placeholder="হোয়াটসঅ্যাপ" class="p-2 border rounded">
                <button onclick="addStudentToDB()" class="md:col-span-4 bg-green-600 text-white font-bold py-2 rounded">সংরক্ষণ করুন</button>
            </div>
            <div class="max-h-40 overflow-y-auto border-t pt-4" id="dbList"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-green-600 text-white p-6 rounded-2xl shadow-lg border-b-4 border-green-800">
                <h2 class="font-bold mb-4 text-xl flex items-center gap-2"><i class="fab fa-whatsapp"></i> হোয়াটসঅ্যাপ গ্রুপ মেসেজ</h2>
                <div class="space-y-3">
                    <select id="bulkClass" class="w-full p-3 rounded-xl text-black font-bold outline-none">
                        <option value="">শ্রেণী সিলেক্ট করুন</option>
                        <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                    </select>
                    <input type="text" id="bulkSubject" placeholder="পরীক্ষার বিষয়" class="w-full p-3 rounded-xl text-black outline-none">
                    <button onclick="sendBulkWhatsApp()" class="w-full bg-white text-green-700 py-3 rounded-xl font-black transition">মেসেজ পাঠান</button>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-lg border-l-8 border-yellow-500">
                <h2 class="font-bold text-xl text-purple-900 mb-2">নোটিশ আপডেট</h2>
                <textarea id="userInput" placeholder="নতুন নোটিশ..." class="w-full p-3 border rounded-xl h-20 bg-gray-50 mb-2"></textarea>
                <button onclick="updateNotice()" class="bg-blue-600 text-white w-full py-2 rounded-xl font-bold">Update</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-lg border-l-8 border-indigo-600">
                <h2 class="text-xl font-bold mb-4 text-indigo-900"><i class="fas fa-user-check mr-2"></i>দৈনিক উপস্থিতি</h2>
                <div class="space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="attDate" class="p-2 border rounded-lg bg-gray-50 text-sm">
                        <select id="attClass" class="p-2 border rounded-lg bg-gray-50 text-sm">
                            <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                        </select>
                    </div>
                    <input type="number" id="attRoll" placeholder="রোল নম্বর" class="w-full p-2 border rounded-lg text-sm">
                    <select id="attStatus" class="w-full p-2 border rounded-lg text-sm font-bold">
                        <option value="Present" class="text-green-600">উপস্থিত (Present)</option>
                        <option value="Absent" class="text-red-600">অনুপস্থিত (Absent)</option>
                    </select>
                    <button onclick="saveAttendance()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold">হাজিরা সেভ</button>
                    <div id="attTable" class="max-h-32 overflow-y-auto mt-2 border-t pt-2"></div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-lg border-l-8 border-rose-500">
                <h2 class="text-xl font-bold mb-4 text-rose-900"><i class="fas fa-money-check-alt mr-2"></i>বেতন ও ফি</h2>
                <div class="space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="feeRoll" placeholder="রোল" class="p-2 border rounded-lg text-sm">
                        <select id="feeMonth" class="p-2 border rounded-lg bg-gray-50 text-sm">
                            <option value="জানুয়ারি">জানুয়ারি</option><option value="ফেব্রুয়ারি">ফেব্রুয়ারি</option><option value="মার্চ">মার্চ</option>
                            <option value="এপ্রিল">এপ্রিল</option><option value="মে">মে</option><option value="জুন">জুন</option>
                            <option value="জুলাই">জুলাই</option><option value="আগস্ট">আগস্ট</option><option value="সেপ্টেম্বর">সেপ্টেম্বর</option>
                            <option value="অক্টোবর">অক্টোবর</option><option value="নভেম্বর">নভেম্বর</option><option value="ডিসেম্বর">ডিসেম্বর</option>
                        </select>
                    </div>
                    <input type="number" id="feeAmount" placeholder="টাকার পরিমাণ" class="w-full p-2 border rounded-lg text-sm">
                    <button onclick="saveFee()" class="w-full bg-rose-500 text-white py-2 rounded-xl font-bold">পেমেন্ট সেভ</button>
                    <div id="feeTable" class="max-h-32 overflow-y-auto mt-2 border-t pt-2"></div>
                </div>
            </div>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-lg mb-8 border-l-8 border-purple-600">
            <h2 class="text-xl font-bold mb-6 text-purple-900">রেজাল্ট এন্ট্রি ফর্ম</h2>
            <div class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
                <div><label class="text-xs font-bold">তারিখ</label><input type="date" id="examDate" class="w-full p-2 border rounded-lg"></div>
                <div><label class="text-xs font-bold">রোল (অটো ফেচ)</label><input type="number" id="stdRoll" oninput="fetchStudentInfo()" class="w-full p-2 border-2 border-blue-400 rounded-lg outline-none"></div>
                <div class="col-span-1"><label class="text-xs font-bold">শ্রেণী</label><input type="text" id="stdClass" class="w-full p-2 border rounded-lg bg-gray-100" readonly></div>
                <div><label class="text-xs font-bold">পরীক্ষার ধরন</label><select id="stdExamType" class="w-full p-2 border rounded-lg font-bold bg-yellow-50">
                    <option value="সাপ্তাহিক">সাপ্তাহিক</option><option value="মাসিক">মাসিক</option><option value="বার্ষিক">বার্ষিক</option>
                </select></div>
                <div class="col-span-2"><label class="text-xs font-bold">নাম</label><input type="text" id="stdName" class="w-full p-2 border rounded-lg bg-gray-100" readonly></div>
                <div class="col-span-2"><label class="text-xs font-bold">WhatsApp</label><input type="text" id="stdWhatsApp" class="w-full p-2 border rounded-lg bg-gray-100" readonly></div>
            </div>
            <div id="subjectInputs" class="bg-purple-50 p-4 rounded-xl mb-6"></div>
            <button onclick="saveData()" class="w-full brand-purple text-white py-3 rounded-xl font-bold shadow-xl">সেভ ও রেজাল্ট মেসেজ</button>
        </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border">
            <div class="p-4 brand-purple text-white flex justify-between items-center">
                <h3 class="font-bold">রেজাল্ট ডাটাবেজ</h3>
                <div class="flex gap-2">
                    <input type="date" id="filterDate" onchange="renderTable()" class="text-black p-1 rounded text-xs">
                    <select id="filterClass" onchange="renderTable()" class="text-black p-1 rounded text-xs font-bold">
                        <option value="সব">সব শ্রেণী</option>
                        <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                    </select>
                    <button onclick="downloadPDF('adminTableArea', 'Records')" class="bg-red-500 px-3 py-1 rounded-full text-xs">PDF</button>
                </div>
            </div>
            <div id="adminTableArea" class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-100 border-b">
                        <tr><th class="p-4">তারিখ</th><th class="p-4">রোল</th><th class="p-4">নাম</th><th class="p-4">শ্রেণী</th><th class="p-4">মোট</th><th class="p-4">মেরিট</th><th class="p-4 text-center">অ্যাকশন</th></tr>
                    </thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="displayArea" class="container mx-auto p-4 flex flex-col items-center hidden">
        <div id="pdfContent" class="bg-white p-8 rounded-xl shadow-2xl border-2 w-full max-w-lg mb-6"></div>
        <div class="flex gap-4 w-full max-w-lg no-print">
            <button onclick="downloadPDF('pdfContent', 'AMC_Doc')" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">Download PDF</button>
            <button onclick="location.reload()" class="flex-1 bg-gray-500 text-white py-3 rounded-xl font-bold">Back Home</button>
        </div>
    </div>

    <script>
        const LOGO_URL = "https://i.ibb.co/Lhy0W0P/1000018420.jpg";
        const subjectsConfig = {
            "৬ষ্ঠ": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম", "আইসিটি"],
            "৭ম": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম", "আইসিটি"],
            "৮ম": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম", "আইসিটি"],
            "৯ম": ["গণিত", "পদার্থ", "রসায়ন", "জীববিজ্ঞান", "উচ্চতর গণিত", "বাংলা", "ইংরেজি"],
            "১০ম": ["গণিত", "পদার্থ", "রসায়ন", "জীববিজ্ঞান", "উচ্চতর গণিত", "বাংলা", "ইংরেজি"]
        };

        // --- Student List Management (Smart Manager) ---
        function toggleStudentManager() {
            const manager = document.getElementById('studentManager');
            manager.classList.toggle('hidden');
            loadStudentList();
        }

        function addStudentToDB() {
            const roll = document.getElementById('newRoll').value;
            const name = document.getElementById('newName').value;
            const cls = document.getElementById('newClass').value;
            const wa = document.getElementById('newWa').value;

            if(!roll || !name) return alert("রোল এবং নাম আবশ্যক!");

            let db = JSON.parse(localStorage.getItem('amc_student_db') || "{}");
            db[roll] = { name, cls, wa };
            localStorage.setItem('amc_student_db', JSON.stringify(db));
            
            loadStudentList();
            alert("সংরক্ষিত হয়েছে!");
            document.getElementById('newRoll').value = '';
            document.getElementById('newName').value = '';
        }

        function loadStudentList() {
            let db = JSON.parse(localStorage.getItem('amc_student_db') || "{}");
            const listDiv = document.getElementById('dbList');
            listDiv.innerHTML = Object.keys(db).map(roll => `
                <div class="flex justify-between items-center p-2 border-b text-xs">
                    <span><b>রোল: ${roll}</b> - ${db[roll].name} (${db[roll].cls})</span>
                    <button onclick="deleteStudentFromDB('${roll}')" class="text-red-500 font-bold">Delete</button>
                </div>
            `).join('');
        }

        function deleteStudentFromDB(roll) {
            if(confirm("Delete this student?")) {
                let db = JSON.parse(localStorage.getItem('amc_student_db') || "{}");
                delete db[roll];
                localStorage.setItem('amc_student_db', JSON.stringify(db));
                loadStudentList();
            }
        }

        // --- Auto Fetch Feature ---
        function fetchStudentInfo() {
            const roll = document.getElementById('stdRoll').value;
            let db = JSON.parse(localStorage.getItem('amc_student_db') || "{}");
            
            if(db[roll]) {
                document.getElementById('stdName').value = db[roll].name;
                document.getElementById('stdClass').value = db[roll].cls;
                document.getElementById('stdWhatsApp').value = db[roll].wa;
                updateSubjectInputs(); 
            } else {
                document.getElementById('stdName').value = "";
                document.getElementById('stdClass').value = "";
                document.getElementById('stdWhatsApp').value = "";
            }
        }

        function showSection(id) {
            ['studentView', 'loginSection', 'adminPanel', 'displayArea'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function adminLogin() {
            if (document.getElementById('adminPass').value === "1617798358Ma@1") {
                sessionStorage.setItem('is_admin', 'true');
                showSection('adminPanel');
                renderTable(); loadAttTable(); loadFeeTable();
                document.getElementById('logoutBtn').classList.remove('hidden');
            } else alert("ভুল পাসওয়ার্ড!");
        }

        function logout() { sessionStorage.removeItem('is_admin'); location.reload(); }

        function updateNotice() {
            const val = document.getElementById("userInput").value;
            if(val) { localStorage.setItem('amc_notice', val); document.getElementById("mainNotice").innerText = val; alert("Updated!"); }
        }

        function updateSubjectInputs() {
            const cls = document.getElementById('stdClass').value;
            const container = document.getElementById('subjectInputs');
            if(!cls) { container.innerHTML = ""; return; }
            
            container.innerHTML = `<div class="grid grid-cols-4 font-bold text-xs mb-2"><div>বিষয়</div><div>MCQ</div><div>CQ</div><div>মোট</div></div>`;
            subjectsConfig[cls].forEach(sub => {
                container.innerHTML += `<div class="grid grid-cols-4 gap-2 mb-2 items-center">
                    <div class="text-xs font-bold">${sub}</div>
                    <input type="number" id="mcq_${sub}" oninput="calcT('${sub}')" class="border p-1 rounded">
                    <input type="number" id="cq_${sub}" oninput="calcT('${sub}')" class="border p-1 rounded">
                    <div id="total_${sub}" class="text-center font-bold text-purple-700">0</div>
                </div>`;
            });
