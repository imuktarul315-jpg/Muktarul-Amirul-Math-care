<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Professional Q-Maker | Pro v13.8</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --paper-font: 'Hind Siliguri', 'Kalpurush', sans-serif;
            --font-size-base: 18px; /* টেক্সট সাইজ বাড়ানো হয়েছে */
        }

        body { 
            font-family: var(--paper-font);
            background-color: #f1f5f9;
        }

        .print-area { 
            width: 210mm; 
            min-height: 297mm; 
            margin: 20px auto; 
            background: white; 
            padding: 20mm; 
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            font-size: var(--font-size-base);
            line-height: 1.7; /* স্বাভাবিক ব্যবধান */
            color: #000;
        }

        /* প্রশ্নের মূল টেক্সট ও নম্বরকে স্বাভাবিক করা */
        .q-main { 
            display: block;
            white-space: pre-line; 
            margin-bottom: 12px;
            font-weight: 500; /* হালকা বোল্ড যাতে স্পষ্ট দেখায় */
        }

        .question-item { 
            position: relative; 
            margin-bottom: 25px; 
            padding-left: 5px;
        }

        /* নম্বর এর জন্য আলাদা স্টাইল */
        .q-number {
            font-weight: 700;
            margin-right: 8px;
            font-size: 1.1em;
        }

        #schoolName { font-size: 32px; font-weight: 800; margin-bottom: 5px; color: #111; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; }
            .print-area { box-shadow: none; margin: 0; width: 100%; padding: 15mm; }
        }

        /* মোবাইল স্ক্রিন অপ্টিমাইজেশন */
        @media (max-width: 768px) {
            .print-area { width: 95%; padding: 10mm; font-size: 16px; }
        }
    </style>
</head>
<body class="text-slate-800">

    <nav class="no-print bg-white border-b px-4 py-2 flex justify-between items-center sticky top-0 z-50">
        <div class="flex flex-col">
            <span class="font-bold text-indigo-700 leading-none text-lg">MathMaker</span>
            <span class="text-[10px] text-slate-400">v13.8 Pro</span>
        </div>
        <div class="flex gap-2">
            <button onclick="clearAllData()" class="px-3 py-1.5 text-red-500 border border-red-200 rounded-lg text-xs font-bold">ক্লিয়ার</button>
            <button onclick="saveToCloud()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold shadow-md">সার্ভারে সেভ</button>
            <button onclick="window.print()" class="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold">প্রিন্ট / PDF</button>
        </div>
    </nav>

    <div class="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 p-4">
        
        <div class="lg:col-span-4 no-print space-y-4">
            <div class="bg-white p-5 rounded-2xl border shadow-sm sticky top-20">
                <input type="text" id="schoolInput" placeholder="প্রতিষ্ঠানের নাম" class="w-full p-2.5 border rounded-xl mb-3 outline-none font-bold focus:ring-2 ring-indigo-50" oninput="syncData()">
                
                <div class="grid grid-cols-2 gap-2 mb-4 text-sm">
                    <input type="text" id="subjectInput" placeholder="বিষয়/সময়" class="p-2 border rounded-lg outline-none" oninput="syncData()">
                    <input type="text" id="classInput" placeholder="শ্রেণি" class="p-2 border rounded-lg outline-none" oninput="syncData()">
                </div>

                <div class="flex bg-slate-100 p-1 rounded-xl mb-4 text-xs font-bold">
                    <button onclick="setType('creative')" id="btn-creative" class="flex-1 py-2 rounded-lg bg-white shadow text-indigo-600">সৃজনশীল</button>
                    <button onclick="setType('short')" id="btn-short" class="flex-1 py-2 rounded-lg text-slate-500">সংক্ষিপ্ত</button>
                    <button onclick="setType('mcq')" id="btn-mcq" class="flex-1 py-2 rounded-lg text-slate-500">MCQ</button>
                </div>

                <textarea id="mainText" placeholder="প্রশ্ন বা উদ্দীপক লিখুন..." class="w-full border p-3 rounded-xl h-32 mb-4 text-sm focus:border-indigo-500 outline-none"></textarea>
                
                <div id="creativeParts" class="space-y-2 mb-4">
                    <input type="text" id="partA" placeholder="ক) অংশ" class="w-full p-2 border rounded-lg text-sm">
                    <input type="text" id="partB" placeholder="খ) অংশ" class="w-full p-2 border rounded-lg text-sm">
                    <input type="text" id="partC" placeholder="গ) অংশ" class="w-full p-2 border rounded-lg text-sm">
                </div>

                <button onclick="addQuestion()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-all">➕ প্রশ্ন যুক্ত করুন</button>
            </div>
        </div>

        <div class="lg:col-span-8 overflow-x-auto">
            <div id="paper" class="print-area">
                <div class="text-center border-b-2 border-black pb-4 mb-6">
                    <h1 id="schoolName" class="editable-part" contenteditable="true">প্রতিষ্ঠানের নাম</h1>
                    <p id="examName" class="font-bold text-lg editable-part" contenteditable="true">বার্ষিক পরীক্ষা - ২০২৬</p>
                    
                    <div class="mt-4 font-bold text-base">
                        <div>শ্রেণি: <span id="className" class="editable-part" contenteditable="true">---</span></div>
                        <div class="flex justify-between px-10">
                            <span>বিষয়/সময়: <span id="subjectName" class="editable-part" contenteditable="true">---</span></span>
                            <span>পূর্ণমান: <span id="marksName" class="editable-part" contenteditable="true">১০০</span></span>
                        </div>
                    </div>
                </div>

                <div id="dynamicContainer">
                    <div id="creativeSection" class="hidden mb-6">
                        <h4 class="font-bold border-b border-gray-300 mb-4 pb-1">সৃজনশীল প্রশ্ন:</h4>
                        <div id="creativeList" class="space-y-6"></div>
                    </div>
                    
                    <div id="shortSection" class="hidden mb-6">
                        <h4 class="font-bold border-b border-gray-300 mb-4 pb-1">সংক্ষিপ্ত প্রশ্ন:</h4>
                        <div id="shortList" class="space-y-4"></div>
                    </div>

                    <div id="mcqSection" class="hidden mb-6">
                        <h4 class="font-bold border-b border-gray-300 mb-4 pb-1">বহুনির্বাচনি প্রশ্ন:</h4>
                        <div id="mcqList" class="space-y-5"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentType = 'creative';
        let qCount = { creative: 1, short: 1, mcq: 1 };

        function setType(type) {
            currentType = type;
            document.getElementById('creativeParts').classList.toggle('hidden', type !== 'creative');
            ['creative', 'short', 'mcq'].forEach(t => {
                document.getElementById(`btn-${t}`).className = t === type ? 
                    'flex-1 py-2 rounded-lg bg-white shadow text-indigo-600' : 'flex-1 py-2 rounded-lg text-slate-500';
            });
        }

        function syncData() {
            document.getElementById('schoolName').innerText = document.getElementById('schoolInput').value || "প্রতিষ্ঠানের নাম";
            document.getElementById('subjectName').innerText = document.getElementById('subjectInput').value || "---";
            document.getElementById('className').innerText = document.getElementById('classInput').value || "---";
        }

        function addQuestion() {
            const text = document.getElementById('mainText').value.trim();
            if (!text) return;

            let html = "";
            let listId = "";
            let sectionId = "";

            if (currentType === 'creative') {
                listId = 'creativeList'; sectionId = 'creativeSection';
                html = `<div>
                            <div class="q-main" contenteditable="true"><span class="q-number">${qCount.creative}।</span>${text}</div>
                            <div class="ml-6 space-y-1 text-[16px]">
                                <div class="flex justify-between border-b border-dotted"><span contenteditable="true">ক) ${document.getElementById('partA').value}</span><b>১</b></div>
                                <div class="flex justify-between border-b border-dotted"><span contenteditable="true">খ) ${document.getElementById('partB').value}</span><b>২</b></div>
                                <div class="flex justify-between border-b border-dotted"><span contenteditable="true">গ) ${document.getElementById('partC').value}</span><b>৪</b></div>
                            </div>
                        </div>`;
                qCount.creative++;
            } else if (currentType === 'short') {
                listId = 'shortList'; sectionId = 'shortSection';
                html = `<div class="q-main" contenteditable="true"><span class="q-number">${qCount.short}।</span>${text}</div>`;
                qCount.short++;
            }

            const wrapper = document.createElement('div');
            wrapper.className = "question-item group";
            wrapper.innerHTML = `<button onclick="this.parentElement.remove(); autoSave();" class="no-print absolute -left-8 text-red-400 opacity-0 group-hover:opacity-100">×</button>${html}`;
            
            document.getElementById(listId).appendChild(wrapper);
            document.getElementById(sectionId).classList.remove('hidden');

            renderMathInElement(wrapper, { delimiters: [{left: '$', right: '$', display: false}] });
            document.getElementById('mainText').value = "";
            autoSave();
        }

        function autoSave() {
            localStorage.setItem('math_maker_v13_save', document.getElementById('paper').innerHTML);
        }

        window.onload = () => {
            const saved = localStorage.getItem('math_maker_v13_save');
            if (saved) document.getElementById('paper').innerHTML = saved;
            renderMathInElement(document.getElementById('paper'), { delimiters: [{left: '$', right: '$', display: false}] });
        };

        function clearAllData() { if(confirm("সব মুছে যাবে?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
