<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমিরুল ম্যাথ কেয়ার - রেজাল্ট ও ব্রডকাস্ট সিস্টেম</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .brand-purple { background-color: #6b21a8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav class="brand-purple p-3 text-white flex justify-between items-center sticky top-0 z-50 shadow-xl border-b-2 border-yellow-500">
        <div class="flex items-center gap-2" onclick="location.reload()" style="cursor: pointer;">
            <img src="https://i.ibb.co/Lhy0W0P/1000018420.jpg" alt="Logo" class="w-10 h-10 rounded-full border border-yellow-400">
            <h1 class="text-sm md:text-lg font-bold uppercase">AMIRUL MATH CARE</h1>
        </div>
        <div class="flex gap-2">
            <button id="logoutBtn" onclick="logout()" class="hidden bg-red-500 text-white px-3 py-1 rounded-full text-xs font-bold">লগ আউট</button>
            <button id="adminLoginBtn" onclick="showSection('loginSection')" class="bg-yellow-500 text-purple-900 px-4 py-1 rounded-full font-bold text-xs">অ্যাডমিন</button>
        </div>
    </nav>

    <div id="studentView" class="container mx-auto mt-6 p-4 max-w-lg">
        <div class="bg-white p-6 rounded-2xl shadow-2xl border-t-4 border-purple-700">
            <h3 class="text-center font-bold text-gray-700 mb-4 uppercase">Search Result</h3>
            <div class="space-y-4">
                <input type="date" id="searchDate" class="w-full p-3 border rounded-xl outline-none bg-gray-50">
                <select id="searchClass" class="w-full p-3 border rounded-xl outline-none">
                    <option value="">শ্রেণী নির্বাচন করুন</option>
                    <option value="৬ষ্ঠ">৬ষ্ঠ শ্রেণী</option><option value="৭ম">৭ম শ্রেণী</option>
                    <option value="৮ম">৮ম শ্রেণী</option><option value="৯ম">৯ম শ্রেণী</option>
                    <option value="১০ম">১০ম শ্রেণী</option>
                </select>
                <input type="text" id="searchRoll" placeholder="রোল নম্বর" class="w-full p-3 border rounded-xl outline-none">
                <button onclick="checkResult()" class="w-full brand-purple text-white py-3 rounded-xl font-bold shadow-lg">রেজাল্ট দেখুন</button>
            </div>
        </div>
    </div>

    <div id="adminPanel" class="container mx-auto mt-6 p-4 hidden">
        
        <div class="bg-indigo-900 text-white p-6 rounded-2xl shadow-xl mb-8 border-b-4 border-green-500">
            <h2 class="font-bold mb-4 flex items-center gap-2">
                <i class="fab fa-whatsapp text-2xl text-green-400"></i> 
                হোয়াটসঅ্যাপ ব্রডকাস্ট (একসাথে সবাইকে মেসেজ)
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <select id="broadcastClass" class="p-3 rounded-xl text-black outline-none font-bold">
                    <option value="">শ্রেণী নির্বাচন করুন</option>
                    <option value="৬ষ্ঠ">৬ষ্ঠ শ্রেণী</option><option value="৭ম">৭ম শ্রেণী</option>
                    <option value="৮ম">৮ম শ্রেণী</option><option value="৯ম">৯ম শ্রেণী</option>
                    <option value="১০ম">১০ম শ্রেণী</option>
                </select>
                <input type="text" id="broadcastMsg" placeholder="আপনার মেসেজটি এখানে লিখুন..." class="p-3 rounded-xl text-black outline-none">
            </div>
            <button onclick="sendBroadcast()" class="w-full mt-4 bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i> মেসেজ পাঠান
            </button>
            <p class="text-[10px] mt-2 text-indigo-200">* মেসেজ পাঠানোর সময় নতুন ট্যাব ওপেন হলে 'Allow' করুন।</p>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8 border-l-4 border-purple-600">
            <h2 class="text-lg font-bold text-purple-900 mb-4 border-b pb-2">নতুন রেজাল্ট এন্ট্রি</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <input type="date" id="examDate" class="p-2 border rounded-lg bg-yellow-50">
                <select id="stdClass" onchange="updateSubjectInputs()" class="p-2 border rounded-lg bg-purple-50 font-bold">
                    <option value="৬ষ্ঠ">৬ষ্ঠ শ্রেণী</option><option value="৭ম">৭ম শ্রেণী</option>
                    <option value="৮ম">৮ম শ্রেণী</option><option value="৯ম">৯ম শ্রেণী</option><option value="১০ম">১০ম শ্রেণী</option>
                </select>
                <input type="text" id="stdName" placeholder="ছাত্রের নাম" class="p-2 border rounded-lg">
                <input type="number" id="stdRoll" placeholder="রোল নম্বর" class="p-2 border rounded-lg">
                <input type="text" id="stdWhatsApp" placeholder="WhatsApp (017...)" class="p-2 border rounded-lg">
            </div>
            <div id="subjectInputs" class="grid grid-cols-2 md:grid-cols-6 gap-3 p-4 bg-gray-50 rounded-xl border mb-6"></div>
            <button onclick="saveData()" class="w-full brand-purple text-white py-4 rounded-xl font-bold">তথ্য সেভ করুন</button>
        </div>

        <div id="studentListArea" class="bg-white rounded-2xl shadow-xl overflow-hidden border">
            <div class="p-4 brand-purple text-white flex justify-between items-center">
                <h3 class="font-bold text-sm">সংরক্ষিত তালিকা</h3>
                <button onclick="downloadPDF('studentListArea', 'Student_List')" class="bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-bold shadow">তালিকা PDF</button>
            </div>
            <table class="w-full text-left border-collapse">
                <thead><tr class="bg-gray-100 text-[10px] uppercase"><th class="p-3 border">তারিখ</th><th class="p-3 border">রোল</th><th class="p-3 border">নাম</th><th class="p-3 border">শ্রেণী</th><th class="p-3 border no-pdf">অ্যাকশন</th></tr></thead>
                <tbody id="dataTableBody" class="text-sm"></tbody>
            </table>
        </div>
    </div>

    <div id="loginSection" class="container mx-auto mt-10 p-6 max-w-md hidden">
        <div class="bg-white p-8 rounded-2xl shadow-lg text-center">
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড" class="w-full p-3 border rounded-xl mb-4 text-center">
            <button onclick="adminLogin()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">লগইন</button>
        </div>
    </div>

    <div id="resultArea" class="container mx-auto p-4 max-w-lg hidden">
        <div id="marksheetPDF" class="bg-white p-8 rounded-lg shadow-xl border-2 border-purple-900"></div>
        <button onclick="downloadPDF('marksheetPDF', 'Marksheet')" class="w-full mt-4 bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg">PDF ডাউনলোড</button>
        <button onclick="location.reload()" class="w-full mt-2 bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-bold">আবার খুঁজুন</button>
    </div>

    <script>
        const subjectsConfig = {
            "৬ষ্ঠ": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম"],
            "৭ম": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম"],
            "৮ম": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম"],
            "৯ম": ["বাংলা", "ইংরেজি", "গণিত", "উচ্চতর গণিত", "পদার্থ", "রসায়ন", "জীববিজ্ঞান"],
            "১০ম": ["বাংলা", "ইংরেজি", "গণিত", "উচ্চতর গণিত", "পদার্থ", "রসায়ন", "জীববিজ্ঞান"]
        };

        function showSection(id) {
            ['studentView', 'loginSection', 'adminPanel', 'resultArea'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function adminLogin() {
            if (document.getElementById('adminPass').value === "1234") {
                localStorage.setItem('amc_admin_auth', 'true');
                showSection('adminPanel');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('adminLoginBtn').classList.add('hidden');
                updateSubjectInputs();
                renderTable();
            } else { alert("ভুল পাসওয়ার্ড!"); }
        }

        function logout() { localStorage.removeItem('amc_admin_auth'); location.reload(); }

        function updateSubjectInputs() {
            const cls = document.getElementById('stdClass').value;
            const container = document.getElementById('subjectInputs');
            container.innerHTML = '';
            subjectsConfig[cls].forEach(sub => {
                container.innerHTML += `<div><label class="text-[9px] font-bold text-gray-500 block">${sub}</label><input type="number" data-sub="${sub}" class="sub-score w-full p-2 border rounded-lg text-sm"></div>`;
            });
        }

        function saveData() {
            const date = document.getElementById('examDate').value;
            const cls = document.getElementById('stdClass').value;
            const name = document.getElementById('stdName').value;
            const roll = document.getElementById('stdRoll').value;
            const wa = document.getElementById('stdWhatsApp').value;
            if(!date || !name || !roll || !wa) return alert("সব তথ্য দিন!");
            let scores = {};
            let total = 0;
            document.querySelectorAll('.sub-score').forEach(input => {
                let val = Number(input.value || 0);
                scores[input.dataset.sub] = val;
                total += val;
            });
            let data = JSON.parse(localStorage.getItem('amc_final_v2') || "[]");
            data.push({ date, cls, name, roll, wa, scores, total });
            localStorage.setItem('amc_final_v2', JSON.stringify(data));
            renderTable();
            alert("সফলভাবে সেভ করা হয়েছে!");
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            const data = JSON.parse(localStorage.getItem('amc_final_v2') || "[]");
            tbody.innerHTML = '';
            data.reverse().forEach((s, index) => {
                tbody.innerHTML += `<tr><td class="p-3 border">${s.date}</td><td class="p-3 border font-bold">${s.roll}</td><td class="p-3 border">${s.name}</td><td class="p-3 border">${s.cls}</td><td class="p-3 border text-center no-pdf"><button onclick="deleteData(${index})" class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>`;
            });
        }

        // ব্রডকাস্ট মেসেজ ফাংশন
        function sendBroadcast() {
            const cls = document.getElementById('broadcastClass').value;
            const msg = document.getElementById('broadcastMsg').value;
            if(!cls || !msg) return alert("শ্রেণী এবং মেসেজ উভয়ই পূরণ করুন!");

            const data = JSON.parse(localStorage.getItem('amc_final_v2') || "[]");
            // ওই শ্রেণীর সকল ইউনিক হোয়াটসঅ্যাপ নম্বর খুঁজে বের করা
            const recipients = [...new Set(data.filter(s => s.cls === cls).map(s => s.wa))];

            if(recipients.length === 0) return alert("এই শ্রেণীতে কোনো ছাত্রের তথ্য পাওয়া যায়নি!");

            if(confirm(`${recipients.length} জন অভিভাবককে মেসেজ পাঠানো শুরু হবে। আপনি কি নিশ্চিত?`)) {
                recipients.forEach((num, i) => {
                    // প্রতি ১.৫ সেকেন্ড অন্তর নতুন উইন্ডোতে হোয়াটসঅ্যাপ ওপেন হবে
                    setTimeout(() => {
                        window.open(`https://wa.me/88${num}?text=${encodeURIComponent(msg)}`, '_blank');
                    }, i * 1500);
                });
            }
        }

        function checkResult() {
            const date = document.getElementById('searchDate').value;
            const roll = document.getElementById('searchRoll').value;
            const cls = document.getElementById('searchClass').value;
            if(!date || !roll) return alert("তারিখ এবং রোল দিন!");
            const data = JSON.parse(localStorage.getItem('amc_final_v2') || "[]");
            const s = data.find(item => item.roll == roll && item.cls == cls && item.date == date);
            if (s) {
                showSection('resultArea');
                let scoreHtml = '';
                for (let sub in s.scores) {
                    scoreHtml += `<tr><td class="p-2 border text-left">${sub}</td><td class="p-2 border font-bold text-center">${s.scores[sub]}</td></tr>`;
                }
                document.getElementById('marksheetPDF').innerHTML = `
                    <div class="text-center mb-6">
                        <img src="https://i.ibb.co/Lhy0W0P/1000018420.jpg" class="w-16 h-16 mx-auto rounded-full border-2 border-yellow-500 mb-2">
                        <h2 class="text-xl font-black text-purple-900 uppercase">AMIRUL MATH CARE</h2>
                        <p class="text-[9px] text-gray-400 font-bold border-b pb-1 tracking-widest">Academic Marksheet</p>
                    </div>
                    <div class="grid grid-cols-2 text-[10px] mb-4 gap-2 border p-3 rounded bg-purple-50 font-bold">
                        <div>নাম: ${s.name}</div><div>রোল: ${s.roll}</div><div>শ্রেণী: ${s.cls}</div><div>তারিখ: ${s.date}</div>
                    </div>
                    <table class="w-full text-xs border-collapse border mb-4">
                        <thead class="bg-gray-100"><tr><th class="p-2 border text-left">বিষয়</th><th class="p-2 border">প্রাপ্ত নম্বর</th></tr></thead>
                        <tbody>${scoreHtml}</tbody>
                    </table>
                    <div class="bg-purple-900 text-white p-3 rounded text-center">
                        <p class="text-xs uppercase">Total Score</p>
                        <p class="text-2xl font-black text-yellow-400">${s.total}</p>
                    </div>`;
            } else { alert("তথ্য পাওয়া যায়নি!"); }
        }

        function downloadPDF(divId, fileName) {
            const element = document.getElementById(divId);
            document.querySelectorAll('.no-pdf').forEach(el => el.style.display = 'none');
            html2pdf().set({ margin: 0.3, filename: fileName + '.pdf', html2canvas: { scale: 3 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } }).from(element).save().then(() => {
                document.querySelectorAll('.no-pdf').forEach(el => el.style.display = '');
            });
        }

        function deleteData(index) {
            if(confirm("মুছবেন?")) {
                let data = JSON.parse(localStorage.getItem('amc_final_v2'));
                data.reverse().splice(index, 1);
                data.reverse();
                localStorage.setItem('amc_final_v2', JSON.stringify(data));
                renderTable();
            }
        }

        window.onload = () => { if(localStorage.getItem('amc_admin_auth')) adminLogin(); };
    </script>
</body>
</html>
