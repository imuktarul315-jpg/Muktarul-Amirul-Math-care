<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIRUL MATH CARE - Complete System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
        .brand-purple { background-color: #6b21a8; }
        .hidden { display: none; }
        .logo-img { width: 60px; height: 60px; object-fit: cover; border-radius: 50%; border: 2px solid #fbbf24; margin: 0 auto; }
    </style>
</head>
<body>

    <div class="bg-yellow-100 border-b border-yellow-200 py-2">
        <div class="container mx-auto px-4 flex items-center">
            <span class="bg-red-600 text-white text-[10px] font-black px-2 py-1 rounded mr-3 animate-pulse uppercase">Notice</span>
            <marquee id="mainNotice">আমিরুল ম্যাথ কেয়ারে আপনাকে স্বাগতম। পরীক্ষার ফলাফল ও নতুন ব্যাচে ভর্তির তথ্য এখানে পাবেন।</marquee>
        </div>
    </div>

    <nav class="brand-purple p-3 text-white flex justify-between items-center sticky top-0 z-50 shadow-xl border-b-2 border-yellow-500">
        <div class="flex items-center gap-2" onclick="location.reload()" style="cursor: pointer;">
            <img src="https://i.ibb.co/Lhy0W0P/1000018420.jpg" alt="Logo" class="w-10 h-10 rounded-full border border-yellow-400">
            <h1 class="text-sm md:text-lg font-bold uppercase">AMIRUL MATH CARE</h1>
        </div>
        <div class="flex gap-2">
            <button id="logoutBtn" onclick="logout()" class="hidden bg-red-500 text-white px-3 py-1 rounded-full text-xs font-bold">লগ আউট</button>
            <button id="adminLoginBtn" onclick="showSection('loginSection')" class="bg-yellow-500 text-purple-900 px-4 py-1 rounded-full font-bold text-xs">অ্যাডমিন</button>
        </div>
    </nav>

    <div id="studentView" class="container mx-auto mt-6 p-4 max-w-lg">
        <div class="bg-white p-6 rounded-3xl shadow-2xl border-t-8 border-purple-700 text-center">
            <h3 class="font-bold text-gray-700 mb-6 text-xl">ফলাফল ও প্রবেশপত্র অনুসন্ধান</h3>
            <div class="space-y-4">
                <select id="searchExamType" class="w-full p-3 border rounded-xl bg-purple-50 outline-none">
                    <option value="সাপ্তাহিক">সাপ্তাহিক পরীক্ষা</option>
                    <option value="মাসিক">মাসিক পরীক্ষা</option>
                    <option value="বার্ষিক">বার্ষিক পরীক্ষা</option>
                </select>
                <input type="date" id="searchDate" class="w-full p-3 border rounded-xl outline-none bg-gray-50">
                <select id="searchClass" class="w-full p-3 border rounded-xl outline-none">
                    <option value="">শ্রেণী নির্বাচন করুন</option>
                    <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                </select>
                <input type="text" id="searchRoll" placeholder="রোল নম্বর" class="w-full p-3 border rounded-xl outline-none">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="checkResult()" class="brand-purple text-white py-3 rounded-xl font-bold shadow-lg">রেজাল্ট</button>
                    <button onclick="generateAdmit()" class="bg-amber-500 text-white py-3 rounded-xl font-bold shadow-lg">অ্যাডমিট</button>
                </div>
            </div>
        </div>
    </div>

    <div id="loginSection" class="container mx-auto mt-10 p-6 max-w-md hidden">
        <div class="bg-white p-8 rounded-2xl shadow-lg text-center border-t-4 border-purple-700">
            <h2 class="font-bold mb-4">অ্যাডমিন লগইন</h2>
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড দিন" class="w-full p-3 border rounded-xl mb-4 text-center">
            <button onclick="adminLogin()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">লগইন</button>
        </div>
    </div>

    <div id="adminPanel" class="container mx-auto mt-6 p-4 hidden">
        
        <div class="bg-green-600 text-white p-6 rounded-2xl shadow-lg mb-6 border-b-4 border-green-800">
            <h2 class="font-bold mb-4 flex items-center gap-2"><i class="fab fa-whatsapp"></i> ক্লাস ভিত্তিক গ্রুপ মেসেজ পাঠান</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <select id="bulkClass" class="p-3 rounded-xl text-black outline-none font-bold">
                    <option value="">শ্রেণী নির্বাচন করুন</option>
                    <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                </select>
                <input type="text" id="bulkSubject" placeholder="পরীক্ষার বিষয় (যেমন: গণিত)" class="p-3 rounded-xl text-black outline-none">
            </div>
            <button onclick="sendBulkWhatsApp()" class="w-full mt-4 bg-white text-green-700 py-3 rounded-xl font-black shadow-xl hover:bg-gray-100 transition">একসাথে সবাইকে মেসেজ পাঠান</button>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-lg mb-6 border-l-8 border-yellow-500">
            <h2 class="font-bold mb-2 text-purple-900">নোটিশ পরিবর্তন</h2>
            <div class="flex gap-2">
                <input type="text" id="userInput" placeholder="নতুন নোটিশ..." class="flex-1 p-3 border rounded-xl outline-none">
                <button onclick="updateNotice()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Update</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8 border-l-8 border-purple-600">
            <h2 class="text-lg font-bold mb-4">নতুন রেজাল্ট এন্ট্রি</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <input type="date" id="examDate" class="p-2 border rounded-lg">
                <select id="stdClass" onchange="updateSubjectInputs()" class="p-2 border rounded-lg">
                    <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                </select>
                <input type="text" id="stdName" placeholder="নাম" class="p-2 border rounded-lg">
                <input type="number" id="stdRoll" placeholder="রোল" class="p-2 border rounded-lg">
                <input type="text" id="stdWhatsApp" placeholder="WhatsApp" class="p-2 border rounded-lg">
            </div>
            <div id="subjectInputs" class="mb-4"></div>
            <button onclick="saveData()" class="w-full brand-purple text-white py-3 rounded-xl font-bold">সেভ ও ব্যক্তিগত মেসেজ</button>
        </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border">
            <div class="p-4 brand-purple text-white flex justify-between items-center">
                <h3 class="font-bold text-xs">ডাটাবেজ</h3>
                <select id="filterClass" onchange="renderTable()" class="text-black p-1 rounded-lg text-xs outline-none">
                    <option value="সব">সব শ্রেণী</option>
                    <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option><option value="৯ম">৯ম</option><option value="১০ম">১০ম</option>
                </select>
                <button onclick="downloadPDF('adminTableArea', 'Results')" class="bg-red-500 px-3 py-1 rounded-full text-[10px]">PDF</button>
            </div>
            <div id="adminTableArea" class="overflow-x-auto">
                <table class="w-full text-left text-[10px]">
                    <thead><tr class="bg-gray-100 border-b"><th class="p-2">তারিখ</th><th class="p-2">রোল</th><th class="p-2">নাম</th><th class="p-2">মোট</th><th class="p-2">GPA</th><th class="p-2">অ্যাকশন</th></tr></thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="displayArea" class="container mx-auto p-4 flex flex-col items-center hidden">
        <div id="pdfContent" class="bg-white p-6 rounded-xl shadow-2xl border-4 border-double border-purple-900 w-full max-w-md"></div>
        <div class="flex gap-2 w-full max-w-md mt-4">
            <button onclick="downloadPDF('pdfContent', 'Result_Sheet')" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">PDF ডাউনলোড</button>
            <button onclick="location.reload()" class="flex-1 bg-gray-400 text-white py-3 rounded-xl font-bold">হোম</button>
        </div>
    </div>

    <script>
        const subjectsConfig = {
            "৬ষ্ঠ": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম", "আইসিটি"],
            "৭ম": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম", "আইসিটি"],
            "৮ম": ["বাংলা", "ইংরেজি", "গণিত", "বিজ্ঞান", "সমাজ", "ধর্ম", "আইসিটি"],
            "৯ম": ["গণিত", "পদার্থ", "রসায়ন", "জীববিজ্ঞান", "উচ্চতর গণিত", "বাংলা", "ইংরেজি"],
            "১০ম": ["গণিত", "পদার্থ", "রসায়ন", "জীববিজ্ঞান", "উচ্চতর গণিত", "বাংলা", "ইংরেজি"]
        };
        const LOGO_URL = "https://i.ibb.co/Lhy0W0P/1000018420.jpg";

        function showSection(id) {
            ['studentView', 'loginSection', 'adminPanel', 'displayArea'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        function adminLogin() {
            if (document.getElementById('adminPass').value === "1617798358Ma@1") {
                sessionStorage.setItem('is_admin', 'true');
                showSection('adminPanel');
                renderTable();
                updateSubjectInputs();
                document.getElementById('logoutBtn').classList.remove('hidden');
            } else alert("ভুল পাসওয়ার্ড!");
        }

        function logout() { sessionStorage.removeItem('is_admin'); location.reload(); }

        function updateNotice() {
            const val = document.getElementById("userInput").value;
            if(val) { document.getElementById("mainNotice").innerText = val; alert("নোটিশ আপডেট হয়েছে!"); }
        }

        function updateSubjectInputs() {
            const cls = document.getElementById('stdClass').value;
            const container = document.getElementById('subjectInputs');
            container.innerHTML = `<div class="grid grid-cols-4 gap-2 font-bold text-[10px] mb-1"><div>বিষয়</div><div>MCQ</div><div>CQ</div><div>মোট</div></div>`;
            subjectsConfig[cls].forEach(sub => {
                container.innerHTML += `<div class="grid grid-cols-4 gap-2 mb-1 border-b pb-1">
                    <div class="text-[9px] font-bold">${sub}</div>
                    <input type="number" id="mcq_${sub}" oninput="calcT('${sub}')" class="border p-1 text-center text-xs">
                    <input type="number" id="cq_${sub}" oninput="calcT('${sub}')" class="border p-1 text-center text-xs">
                    <div id="total_${sub}" class="text-center font-bold text-blue-600 text-xs">0</div>
                </div>`;
            });
        }

        function calcT(s) {
            const m = Number(document.getElementById(`mcq_${s}`).value || 0);
            const c = Number(document.getElementById(`cq_${s}`).value || 0);
            document.getElementById(`total_${s}`).innerText = m + c;
        }

        function saveData() {
            const date = document.getElementById('examDate').value;
            if(!date) return alert("তারিখ দিন!");
            const cls = document.getElementById('stdClass').value;
            const name = document.getElementById('stdName').value;
            const roll = document.getElementById('stdRoll').value;
            const wa = document.getElementById('stdWhatsApp').value;

            let scores = {}; let grandTotal = 0; let totalP = 0;
            subjectsConfig[cls].forEach(sub => {
                const t = Number(document.getElementById(`total_${sub}`).innerText);
                const p = t >= 80 ? 5.0 : t >= 70 ? 4.0 : t >= 60 ? 3.5 : t >= 50 ? 3.0 : t >= 40 ? 2.0 : t >= 33 ? 1.0 : 0;
                scores[sub] = { t, g: p>=5?'A+':p>=4?'A':p>=3.5?'A-':p>=3?'B':p>=2?'C':p>=1?'D':'F' };
                grandTotal += t; totalP += p;
            });

            let data = JSON.parse(localStorage.getItem('amc_db_final') || "[]");
            data.push({ date, cls, name, roll, wa, scores, grandTotal, gpa: (totalP/subjectsConfig[cls].length).toFixed(2) });
            localStorage.setItem('amc_db_final', JSON.stringify(data));
            renderTable();
            alert("তথ্য সেভ হয়েছে!");
            window.open(`https://wa.me/88${wa}?text=Result: ${grandTotal}`, '_blank');
        }

        // --- গ্রুপ মেসেজ ফাংশন (বাল্ক হোয়াটসঅ্যাপ) ---
        function sendBulkWhatsApp() {
            const cls = document.getElementById('bulkClass').value;
            const subject = document.getElementById('bulkSubject').value;
            if(!cls) return alert("শ্রেণী নির্বাচন করুন!");
            
            let data = JSON.parse(localStorage.getItem('amc_db_final') || "[]");
            let students = data.filter(s => s.cls === cls);
            
            if(students.length === 0) return alert("এই শ্রেণীর কোনো ছাত্র ডাটাবেজে নেই!");
            
            alert(`${students.length} জনের মেসেজ পাঠানোর প্রক্রিয়া শুরু হচ্ছে। একে একে ট্যাব খুলবে।`);
            
            students.forEach((s, index) => {
                setTimeout(() => {
                    const msg = `*আমিরুল ম্যাথ কেয়ার (ফলাফল)*%0Aবিষয়: ${subject}%0Aনাম: ${s.name}%0Aরোল: ${s.roll}%0Aমোট নম্বর: ${s.grandTotal}%0AGPA: ${s.gpa}%0Aধন্যবাদ।`;
                    window.open(`https://wa.me/88${s.wa}?text=${msg}`, '_blank');
                }, index * 2000); // ২ সেকেন্ড গ্যাপ যাতে ব্রাউজার ব্লক না করে
            });
        }

        function renderTable() {
            const filter = document.getElementById('filterClass').value;
            const tbody = document.getElementById('dataTableBody');
            let data = JSON.parse(localStorage.getItem('amc_db_final') || "[]");
            if(filter !== "সব") data = data.filter(s => s.cls === filter);
            tbody.innerHTML = '';
            data.reverse().forEach((s, i) => {
                tbody.innerHTML += `<tr class="border-b"><td class="p-2">${s.date}</td><td class="p-2">${s.roll}</td><td class="p-2">${s.name}</td><td class="p-2 font-bold">${s.grandTotal}</td><td class="p-2 font-bold text-green-600">${s.gpa}</td><td class="p-2"><button onclick="deleteData(${data.length-1-i})" class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>`;
            });
        }

        function deleteData(index) {
            if(confirm("মুছে ফেলতে চান?")) {
                let data = JSON.parse(localStorage.getItem('amc_db_final'));
                data.splice(index, 1);
                localStorage.setItem('amc_db_final', JSON.stringify(data));
                renderTable();
            }
        }

        function checkResult() {
            const roll = document.getElementById('searchRoll').value;
            const cls = document.getElementById('searchClass').value;
            const date = document.getElementById('searchDate').value;
            const data = JSON.parse(localStorage.getItem('amc_db_final') || "[]");
            const s = data.find(item => item.roll == roll && item.cls == cls && item.date == date);
            if (s) {
                showSection('displayArea');
                let scoreRows = '';
                for(let sub in s.scores) scoreRows += `<tr class="text-center border"><td>${sub}</td><td>${s.scores[sub].t}</td><td>${s.scores[sub].g}</td></tr>`;
                document.getElementById('pdfContent').innerHTML = `<div class="text-center border-b pb-2 mb-2"><img src="${LOGO_URL}" class="logo-img"><h2 class="font-bold">AMIRUL MATH CARE</h2><p class="text-[10px] text-gray-500 italic">তারিখ: ${s.date}</p></div><div class="text-[11px] mb-2"><p>নাম: ${s.name} | রোল: ${s.roll}</p><p>শ্রেণী: ${s.cls} | GPA: ${s.gpa}</p></div><table class="w-full text-[10px] border"><tr><th>বিষয়</th><th>প্রাপ্ত নম্বর</th><th>গ্রেড</th></tr>${scoreRows}</table><div class="mt-4 text-center font-bold bg-purple-900 text-white p-2 rounded">মোট নম্বর: ${s.grandTotal}</div>`;
            } else alert("রেজাল্ট পাওয়া যায়নি!");
        }

        function downloadPDF(id, name) {
            const el = document.getElementById(id);
            html2pdf().set({ margin: 0.5, filename: name+'.pdf', html2canvas: { scale: 3 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } }).from(el).save();
        }

        window.onload = () => showSection('studentView');
    </script>
</body>
</html>
